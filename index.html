  <script>
    try { if (localStorage.getItem('mf-tema') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
    // Diagnóstico: guarda cualquier error de arranque para mostrarlo en pantalla
    window.__MF_CLAVE = '';
    window.__mfErrores = [];
    window.addEventListener('error', function (e) {
      var cod = '';
      try { if (e.lineno) cod = (document.documentElement.outerHTML.split('\n')[e.lineno - 1] || '').trim().slice(0, 160); } catch (x) {}
      window.__mfErrores.push((e.message || 'Error desconocido') + (e.lineno ? ' (línea ' + e.lineno + ')' : '') + (cod ? ' · código: ' + cod : ''));
    });
    // Si la lógica de la app no arrancó (archivo incompleto o con error), lo dice en pantalla en vez de quedar en blanco
    setTimeout(function () {
      if (window.__mfIniciada) return;
      var err = (window.__mfErrores[0] || '').replace(/[<>&]/g, '');
      document.getElementById('app').innerHTML = '<div class="empty"><div class="empty__ic"><span class="ms">error</span></div>' +
        '<h3>La app no pudo iniciar</h3><p>' + (err ? 'Error: ' + err : 'El archivo App.html no se cargó o está incompleto.') + '</p>' +
        '<p>Revisa que App.html esté completo (la última línea debe ser &lt;/script&gt;), guarda y publica una nueva versión.</p></div>';
    }, 5000);
  </script>

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
body { overscroll-behavior-y: none; min-height: 100dvh;
  background: linear-gradient(180deg, var(--t090a0f) 0%, var(--t0d0f17) 50%, var(--t090a0f) 100%) fixed; }
::-webkit-scrollbar { display: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }

.ms {
  font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
  font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap; direction: ltr; user-select: none;
  font-feature-settings: 'liga'; -webkit-font-feature-settings: 'liga';
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
.ms.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.num { font-variant-numeric: tabular-nums; }
.c-green { color: var(--green) !important; }
.c-coral { color: var(--coral) !important; }
.c-muted { color: var(--muted); }

/* ---------- Barra superior ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  padding-top: var(--sat);
  background: rgba(var(--deep),.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.topbar__in { height: var(--head-h); max-width: 640px; margin: 0 auto; padding: 0 16px;
  display: flex; align-items: center; gap: 12px; }
.brand-ic {
  width: 40px; height: 40px; border-radius: 16px; flex-shrink: 0;
  background: var(--t1e161c); border: 1px solid rgba(255,59,92,.3); color: var(--coral);
  display: grid; place-items: center; box-shadow: 0 0 12px rgba(255,59,92,.25);
}
.topbar__txt { min-width: 0; display: flex; flex-direction: column; }
.topbar__kick { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); line-height: 1; }
.topbar__title { font-size: 17px; font-weight: 700; letter-spacing: -.01em; margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar__actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.demo-badge { white-space: nowrap; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 8px; border-radius: 999px; color: var(--amber); background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.25); }

.iconbtn {
  width: 40px; height: 40px; border-radius: 999px; flex-shrink: 0;
  display: grid; place-items: center;
  background: rgba(var(--ink),.06); border: 1px solid rgba(var(--ink),.08);
  transition: background .2s, transform .15s;
}
.iconbtn:hover { background: rgba(var(--ink),.12); }
.iconbtn:active { transform: scale(.92); }
.iconbtn.sm { width: 32px; height: 32px; }
.iconbtn.sm .ms { font-size: 18px; }

/* ---------- Contenido ---------- */
main {
  max-width: 640px; margin: 0 auto;
  padding: calc(var(--head-h) + var(--sat) + 14px) 16px calc(var(--nav-h) + var(--sab) + 40px);
}
body.sub main { padding-bottom: calc(var(--sab) + 32px); }
.stack { display: flex; flex-direction: column; gap: 18px; }
.stack.sm { gap: 14px; }

/* ---------- Navegación inferior ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding-bottom: var(--sab);
  background: rgba(var(--deep),.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(var(--ink),.08); box-shadow: 0 -4px 20px rgba(var(--shade),.6);
}
.nav__in { height: var(--nav-h); max-width: 640px; margin: 0 auto; display: flex; }
.nav__item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: 11px; font-weight: 500; transition: color .2s, transform .15s; }
.nav__item .ms { font-size: 24px; }
.nav__item.active { color: var(--coral); font-weight: 600; }
.nav__item.active .ms { filter: drop-shadow(0 0 8px rgba(255,59,92,.45)); }
.nav__item:active { transform: scale(.94); }
body.sub .nav, body.sub .fab { display: none; }

.nav__centro { flex: 1; display: flex; justify-content: center; align-items: flex-start; }
.fab {
  position: relative; z-index: 41; width: 58px; height: 58px; margin-top: -20px; border-radius: 999px;
  display: grid; place-items: center; color: #fff; border: 4px solid var(--bg);
  background: linear-gradient(135deg, var(--coral-2), var(--coral));
  box-shadow: 0 6px 20px rgba(255,59,92,.45);
  transition: transform .15s, box-shadow .2s;
}
.fab .ms { font-size: 30px; }
.fab:hover { box-shadow: 0 8px 26px rgba(255,59,92,.6); }
.fab:active { transform: scale(.92); }

/* ---------- Selector de mes ---------- */
.month { display: flex; justify-content: center; }
.month__pill { display: inline-flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px;
  background: rgba(var(--deep),.9); border: 1px solid var(--line-2); box-shadow: 0 8px 24px rgba(var(--shade),.3); }
.month__pill .ic { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; color: var(--muted); transition: all .2s; }
.month__pill .ic:hover { color: var(--text); background: rgba(var(--ink),.06); }
.month__pill .ic:active { transform: scale(.9); }
.month__label { display: flex; align-items: center; gap: 6px; padding: 0 6px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.month__label .ms { color: var(--coral); font-size: 18px; }
.month--mini { justify-content: flex-start; }
.month--mini .month__pill { box-shadow: none; background: rgba(var(--ink),.05); }
.month--mini .month__label { font-size: 13px; padding: 0 2px; }
.month--mini .ic { width: 28px; height: 28px; }

/* ---------- Tarjeta principal ---------- */
.hero {
  position: relative; overflow: hidden; padding: 20px; border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--t161a26), var(--t10131d) 55%, var(--t0d0f15));
  border: 1px solid rgba(var(--ink),.08); box-shadow: 0 8px 32px rgba(var(--shade),.5);
}
.hero > *:not(.glow) { position: relative; z-index: 1; }
.glow { position: absolute; border-radius: 999px; filter: blur(48px); pointer-events: none; animation: glow 8s ease-in-out infinite; }
.glow--coral { width: 200px; height: 200px; top: -64px; right: -64px; background: rgba(255,59,92,.18); }
.glow--green { width: 180px; height: 180px; bottom: -64px; left: -64px; background: rgba(0,208,156,.12); animation-delay: -3.5s; }
.glow--blue { width: 160px; height: 160px; bottom: -48px; left: -48px; background: rgba(59,130,246,.12); }
.hero__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hero__label { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
.hero__amount { font-size: 34px; font-weight: 700; letter-spacing: -.03em; margin-top: 2px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  background: rgba(var(--ink),.06); border: 1px solid var(--line-2); font-size: 11px; font-weight: 600; color: var(--te2e8f0); }
.dot { width: 8px; height: 8px; border-radius: 999px; background: var(--green); flex-shrink: 0; }
.dot.pulse { animation: blink 2s ease-in-out infinite; }
.hero__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(var(--ink),.08); }
.hero__k { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
.hero__k .ms { font-size: 15px; }
.hero__v { font-size: 17px; font-weight: 600; margin-top: 2px; }
.hero__foot { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 12px; font-size: 11px; color: var(--muted); letter-spacing: .02em; }
.hero__foot i { width: 6px; height: 6px; border-radius: 9px; background: var(--t64748b); }

/* ---------- Paneles ---------- */
.panel { padding: 14px; border-radius: var(--r-lg); background: rgba(var(--deep),.8);
  border: 1px solid rgba(var(--ink),.07); box-shadow: 0 8px 24px rgba(var(--shade),.35); }
.panel__head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
.panel__title { font-size: 16px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.panel__title.sm { font-size: 14px; }
.panel__title .ms { font-size: 18px; color: var(--muted); }
.panel__sub { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.panel__sub i { width: 6px; height: 6px; border-radius: 9px; background: var(--coral); }
.link { display: inline-flex; align-items: center; gap: 2px; color: var(--coral); font-size: 12px; font-weight: 600; white-space: nowrap; }
.link .ms { font-size: 16px; transition: transform .2s; }
.link:hover .ms { transform: translateX(3px); }
.hint { font-size: 13px; color: var(--muted); line-height: 1.5; }

/* ---------- Tarjetas de crédito/débito ---------- */
.carousel { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  margin: 0 -14px; padding: 4px 14px 8px; }
.ccard {
  --acc: var(--green);
  position: relative; flex: 0 0 264px; min-height: 136px; scroll-snap-align: start; scroll-margin-left: 14px;
  padding: 14px; border-radius: var(--r-lg); text-align: left; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  background: linear-gradient(135deg, #1a1f2c, #141722 50%, #0e111a);
  border: 1px solid var(--line-2); box-shadow: 0 6px 18px rgba(0,0,0,.35);
  transition: transform .25s cubic-bezier(.16,1,.3,1), opacity .25s, border-color .2s, box-shadow .25s;
}
.ccard--indigo { --acc: var(--indigo); background: linear-gradient(135deg, #201c38, #161327 50%, #0f0e1c); }
.ccard--amber  { --acc: var(--amber); background: linear-gradient(135deg, #2a2218, #1c1710 50%, #120f0a); border-color: rgba(245,158,11,.22); }
.ccard--coral  { --acc: var(--coral); background: linear-gradient(135deg, #2a161c, #1c1015 50%, #120a0d); border-color: rgba(255,59,92,.2); }
.ccard--slate  { --acc: #38bdf8; background: linear-gradient(135deg, #1c222b, #12161d 50%, #0c0f14); }
.ccard__shine { position: absolute; inset: 0; pointer-events: none; background-size: 200% 100%;
  background-image: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.03) 40%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.03) 60%, transparent 80%);
  transition: background-position .6s ease; }
.ccard:hover .ccard__shine, .ccard:active .ccard__shine { background-position: -100% 0; }
.ccard:active { transform: scale(.99); }
.ccard.is-selected { border-color: rgba(255,59,92,.8); transform: translateY(-2px);
  box-shadow: 0 10px 28px -4px rgba(255,59,92,.25), 0 0 0 1px rgba(255,59,92,.4); }
.ccard.is-dimmed { opacity: .5; }
.ccard__top, .ccard__row, .ccard__foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; position: relative; }
.ccard__brand { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #e2e8f0; }
.ccard__brand b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ccard__brand .ms { font-size: 18px; color: var(--acc); }
.ccard__right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.ccard__num { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.ccard__badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: var(--acc);
  background: color-mix(in srgb, var(--acc) 18%, transparent); border: 1px solid color-mix(in srgb, var(--acc) 40%, transparent); }
.ccard__body { display: flex; flex-direction: column; gap: 6px; position: relative; }
.ccard__lbl { font-size: 11px; color: var(--muted); font-weight: 600; }
.ccard__val { font-size: 16px; font-weight: 600; }
.ccard__foot { font-size: 11px; color: var(--muted); }
.bar { display: block; height: 6px; border-radius: 999px; background: rgba(var(--ink),.08); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--acc);
  box-shadow: 0 0 8px var(--acc); transition: width 1s cubic-bezier(.16,1,.3,1); }
.ccard--add { align-items: center; justify-content: center; flex-direction: column; color: var(--muted);
  background: rgba(255,255,255,.02); border: 1.5px dashed rgba(255,255,255,.14); box-shadow: none; }
.ccard--add .ms { font-size: 28px; color: var(--coral); }

/* ---------- Lista de movimientos ---------- */
.txlist { display: flex; flex-direction: column; gap: 4px; }
.tx { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px;
  border-radius: var(--r); min-height: 60px; border: 1px solid transparent; transition: background .2s, transform .15s, border-color .2s; }
.tx:hover { background: rgba(var(--ink),.04); border-color: rgba(var(--ink),.05); }
.tx:active { transform: scale(.99); background: rgba(var(--ink),.06); }
.tx__ic { width: 40px; height: 40px; border-radius: 999px; flex-shrink: 0; display: grid; place-items: center;
  border: 1px solid rgba(var(--ink),.06); background: var(--t1e2332); transition: transform .3s; }
.tx:hover .tx__ic { transform: scale(1.08); }
.tx__main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tx__name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 5px; min-width: 0; }
.tx__name > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx__mini { font-size: 14px; color: var(--muted-2); flex-shrink: 0; }
.tx__sub { font-size: 13px; color: var(--t878d9f); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx__right { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; padding-left: 6px; }
.tx__amt { font-size: 15px; font-weight: 600; white-space: nowrap; }
.tx__time { font-size: 11px; color: var(--muted-2); font-weight: 600; margin-top: 2px; }

.group { display: flex; flex-direction: column; gap: 6px; }
.group-card { background: var(--t131620); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: 0 12px 28px rgba(var(--shade),.35); }
.group-card .tx { border-radius: 0; padding: 12px; border: 0; }
.group-card .tx + .tx { border-top: 1px solid rgba(var(--ink),.05); }
.day-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; }
.day-head__l { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--t9ba1b0); }
.day-head__l i { width: 6px; height: 6px; border-radius: 999px; background: var(--t4c5163); }
.day-head__l i.hoy { background: var(--coral); box-shadow: 0 0 8px var(--coral); }
.day-head__t { font-size: 15px; font-weight: 500; color: var(--text-2); }

/* ---------- Buscador y chips ---------- */
.search { position: relative; }
.search > .ms { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--t7c8397); pointer-events: none; }
.input {
  width: 100%; height: 48px; padding: 0 16px; border-radius: var(--r); outline: none;
  background: var(--t0e1017); border: 1px solid rgba(var(--ink),.08); color: var(--text);
  transition: border-color .2s, box-shadow .2s;
}
.input::placeholder { color: var(--t6e7488); }
.input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(255,59,92,.15); }
.search .input { padding-left: 44px; border-radius: var(--r-lg); background: var(--t161922); box-shadow: 0 4px 14px rgba(var(--shade),.25); }
textarea.input { height: auto; min-height: 76px; padding: 12px 16px; resize: vertical; line-height: 1.45; }
input[type=date].input, input[type=time].input { padding-right: 10px; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; white-space: nowrap;
  background: rgba(var(--ink),.05); border: 1px solid rgba(var(--ink),.08); color: var(--muted);
  font-size: 12px; font-weight: 600; transition: all .2s;
}
.chip .ms { font-size: 16px; }
.chip:active { transform: scale(.96); }
.chip.on { background: rgba(var(--ink),.15); color: var(--text); border-color: rgba(var(--ink),.18); }
.chip.on.coral { background: var(--coral); border-color: var(--coral); box-shadow: 0 4px 14px rgba(255,59,92,.35); }
.chip.on.green { background: var(--green); border-color: var(--green); color: #002116; box-shadow: 0 4px 14px rgba(0,208,156,.3); }
.chip.on .ms { color: inherit !important; }

/* ---------- Archivo ---------- */
.atabs { display: flex; justify-content: space-around; }
.atab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
.atab__ic { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 999px; transition: transform .15s; }
.atab:active .atab__ic { transform: scale(.9); }
.atab .ms { font-size: 26px; }
.atab i { width: 20px; height: 2px; border-radius: 2px; background: var(--coral); opacity: 0; transition: opacity .3s; margin-top: 2px; }
.atab.on { color: var(--text); }
.atab.on .ms { color: var(--coral); }
.atab.on i { opacity: 1; }
.ribbon { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ribbon__s { font-size: 11px; color: var(--muted); white-space: nowrap; }
.ribbon__s b { color: var(--text); }

.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin: 0 -12px; }
.ptile { position: relative; aspect-ratio: 3 / 4; border-radius: 6px; overflow: hidden; background: var(--surface-3); cursor: pointer; outline: none; }
.ptile:active { transform: scale(.98); }
.ptile__img, .ptile__ph { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform .5s; }
.ptile:hover .ptile__img { transform: scale(1.05); }
.ptile__ph { display: grid; place-items: center; }
.ptile__ph .ms { font-size: 34px; opacity: .9; }
.ptile::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(9,10,15,0) 40%, rgba(9,10,15,.9) 100%); }
.ptile__date { position: absolute; top: 6px; left: 6px; z-index: 2; padding: 2px 6px; border-radius: 6px;
  background: rgba(13,14,19,.8); backdrop-filter: blur(8px); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.ptile__fav { position: absolute; top: 5px; right: 5px; z-index: 3; width: 26px; height: 26px; border-radius: 999px;
  display: grid; place-items: center; color: #e2e8f0; background: rgba(13,14,19,.6); backdrop-filter: blur(8px); transition: transform .15s; }
.ptile__fav .ms { font-size: 15px; }
.ptile__fav.on { color: var(--coral); }
.ptile__fav:active { transform: scale(1.25); }
.ptile__info { position: absolute; left: 7px; right: 7px; bottom: 6px; z-index: 2; pointer-events: none; }
.ptile__name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptile__amt { font-size: 11px; font-weight: 700; color: #ffb3b6; }

.cal__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.cal__head h2 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.cal__dow { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; font-weight: 700; color: var(--t8d909f); text-transform: uppercase; padding: 4px 0 6px; }
.cal__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal__d { position: relative; height: 48px; border-radius: 10px; display: grid; place-items: center; overflow: hidden;
  font-size: 12px; font-weight: 600; color: var(--t3f4352); }
.cal__d.has { background: var(--surface-3); color: var(--text); transition: transform .15s; }
.cal__d.has:active { transform: scale(.9); }
.cal__d .bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .5; }
.cal__d > span { position: relative; z-index: 1; text-shadow: 0 1px 4px rgba(var(--shade),.8); }
.cal__n { position: absolute; z-index: 1; bottom: 2px; right: 4px; font-size: 9px; font-weight: 800; font-style: normal; color: var(--coral); }
.cal__d.big { box-shadow: 0 0 12px rgba(255,81,104,.35); }
.cal__d.big .cal__n { color: var(--green); background: rgba(var(--deep),.8); padding: 0 3px; border-radius: 3px; }
.cal__d.hoy { outline: 1.5px solid rgba(255,59,92,.7); outline-offset: -1.5px; }

/* ---------- Detalle ---------- */
.dhero { position: relative; overflow: hidden; text-align: center; padding: 22px 20px; border-radius: var(--r-lg);
  background: linear-gradient(180deg, var(--t141824), var(--t0d1017)); border: 1px solid var(--line-2); box-shadow: 0 12px 36px rgba(var(--shade),.5); }
.dhero > *:not(.glow) { position: relative; z-index: 1; }
.dhero__fav { position: absolute !important; top: 12px; right: 12px; }
.dhero__fav.on { color: var(--coral); }
.dhero__ic { width: 56px; height: 56px; border-radius: 999px; margin: 0 auto 12px; display: grid; place-items: center;
  background: var(--t1b2030); border: 1px solid rgba(var(--ink),.15); box-shadow: inset 0 2px 8px rgba(var(--shade),.4); }
.dhero__ic .ms { font-size: 26px; }
.pill-tipo { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; margin-bottom: 8px; border-radius: 999px;
  background: var(--t1c2233); border: 1px solid var(--line-2); font-size: 11px; font-weight: 500; color: var(--tcbd5e1); letter-spacing: .02em; }
.pill-tipo i { width: 6px; height: 6px; border-radius: 9px; }
.dhero__name { font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 2px; }
.dhero__amt { font-size: 38px; font-weight: 700; letter-spacing: -.02em; }
.dhero__amt small { font-size: 28px; opacity: .9; }
.dhero__date { font-size: 13px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 2px; }
.dhero__date .ms { font-size: 15px; }

.kv__row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.kv__row:last-child { border-bottom: 0; padding-bottom: 2px; }
.kv__row span { color: var(--muted); flex-shrink: 0; }
.kv__row b { font-weight: 500; text-align: right; overflow-wrap: anywhere; }

.map { position: relative; height: 150px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line-2); background: #0c0e15; margin-bottom: 12px; }
.map iframe { width: 100%; height: 100%; border: 0; pointer-events: none;
  filter: invert(.9) hue-rotate(180deg) saturate(.55) brightness(.85) contrast(1.1); }
.map::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(0deg, rgba(9,10,15,.7), transparent 55%); }
.map__tag { position: absolute; left: 8px; bottom: 8px; z-index: 1; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px;
  background: rgba(0,0,0,.7); border: 1px solid var(--line-2); max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.map__foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.btn-sm { display: inline-flex; align-items: center; gap: 4px; padding: 7px 12px; border-radius: 10px; flex-shrink: 0;
  background: var(--t1f2432); border: 1px solid var(--line-2); font-size: 12px; font-weight: 600; white-space: nowrap; transition: background .2s, transform .15s; }
.btn-sm:hover { background: var(--t282f42); }
.btn-sm:active { transform: scale(.97); }
.btn-sm .ms { font-size: 15px; }

.file { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r); background: var(--surface-3); border: 1px solid var(--line); }
.file__thumb { width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; color: var(--tcbd5e1);
  background: var(--t242a3a) center/cover no-repeat; border: 1px solid var(--line-2); }

.btn { width: 100%; height: 48px; border-radius: var(--r); display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 15px; font-weight: 600; transition: transform .15s, background .2s, opacity .2s; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .6; pointer-events: none; }
.btn .ms { font-size: 19px; }
.btn--white { background: #fff; color: #090A0F; }
.btn--white:hover { background: #f1f5f9; }
.btn--danger { color: var(--coral); border: 1px solid rgba(255,59,92,.25); }
.btn--danger:hover { background: rgba(255,59,92,.1); }
.btn--primary { color: #fff; background: linear-gradient(135deg, var(--coral-2), var(--coral)); box-shadow: 0 4px 20px rgba(255,59,92,.35); }
.btn--ghost { background: rgba(var(--ink),.08); border: 1px solid rgba(var(--ink),.12); }
.btn--ghost:hover { background: rgba(var(--ink),.15); }
.btn--auto { width: auto; padding: 0 20px; height: 44px; }
.actions { display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }

/* ---------- Formulario ---------- */
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 999px; background: rgba(var(--ink),.05); border: 1px solid rgba(var(--ink),.08); }
.seg button { height: 38px; border-radius: 999px; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .25s; }
.seg button .ms { font-size: 18px; }
.seg button.on.gasto { background: var(--coral); color: #fff; box-shadow: 0 4px 14px rgba(255,59,92,.35); }
.seg button.on.ingreso { background: var(--green); color: #002116; box-shadow: 0 4px 14px rgba(0,208,156,.3); }
.amount { text-align: center; padding: 6px 0 2px; }
.amount label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.amount__row { display: flex; align-items: center; justify-content: center; gap: 2px; color: var(--coral); }
.amount__row span { font-size: 32px; font-weight: 700; opacity: .8; }
.amount__row input { width: 7ch; min-width: 0; max-width: 100%; background: none; border: 0; outline: none; text-align: center;
  font-size: 44px; font-weight: 700; letter-spacing: -.03em; color: inherit; font-variant-numeric: tabular-nums; }
.amount__row input::placeholder { color: rgba(255,59,92,.35); }
.amount.ing .amount__row { color: var(--green); }
.amount.ing .amount__row input::placeholder { color: rgba(0,208,156,.35); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo-drop { width: 100%; height: 140px; border-radius: var(--r-lg); border: 1.5px dashed rgba(var(--ink),.14);
  background: rgba(var(--ink),.02); color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: border-color .2s, background .2s; }
.photo-drop:hover { border-color: rgba(255,59,92,.5); background: rgba(255,59,92,.04); }
.photo-drop .ms { font-size: 30px; color: var(--coral); }
.photo-drop small { font-size: 11px; color: var(--muted-2); }
.photo-prev { position: relative; height: 210px; border-radius: var(--r-lg); overflow: hidden; background: var(--t0e1017) center/cover no-repeat; border: 1px solid var(--line-2); }
.photo-prev__acts { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.photo-prev__acts .iconbtn { background: rgba(13,14,19,.7); backdrop-filter: blur(8px); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: var(--r);
  background: var(--t0e1017); border: 1px solid rgba(var(--ink),.08); width: 100%; text-align: left; }
.toggle-row .ms { color: var(--coral); }
.switch { width: 44px; height: 26px; border-radius: 999px; background: rgba(var(--ink),.12); position: relative; flex-shrink: 0; transition: background .25s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 999px; background: #fff; transition: transform .25s cubic-bezier(.16,1,.3,1); }
.switch.on { background: var(--coral); }
.switch.on::after { transform: translateX(18px); }

/* ---------- Cuentas ---------- */
.clist { display: flex; flex-direction: column; padding: 6px 14px; }
.crow { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.crow + .crow { border-top: 1px solid var(--line); }
.sw { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: grid; place-items: center; color: #fff; border: 2px solid transparent; transition: transform .15s, border-color .2s; }
.sw--emerald { background: linear-gradient(135deg, #0f766e, #064e3b); }
.sw--indigo  { background: linear-gradient(135deg, #4f46e5, #312e81); }
.sw--amber   { background: linear-gradient(135deg, #b45309, #78350f); }
.sw--coral   { background: linear-gradient(135deg, #e11d48, #881337); }
.sw--slate   { background: linear-gradient(135deg, #334155, #0f172a); }
.swatches { display: flex; gap: 10px; }
.swatches .sw { width: 36px; height: 36px; border-radius: 999px; }
.swatches .sw.on { border-color: var(--text); transform: scale(1.08); }

/* ---------- Capas: hoja inferior, diálogo, visor ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(var(--deep),.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  opacity: 0; pointer-events: none; transition: opacity .25s; }
.overlay.open { opacity: 1; pointer-events: auto; }
.sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; padding: 8px 16px calc(22px + var(--sab));
  background: var(--t161922); border-radius: 28px 28px 0 0; border-top: 1px solid var(--line-2); box-shadow: 0 -8px 32px rgba(var(--shade),.6);
  transform: translateY(30px); transition: transform .3s cubic-bezier(.16,1,.3,1); }
.overlay.open .sheet { transform: none; }
.grabber { width: 48px; height: 5px; border-radius: 999px; background: var(--t34343a); margin: 4px auto 14px; }
.sheet__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.sheet__head h3 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.sheet__head p { font-size: 13px; color: var(--muted); margin-top: 2px; }
.dtotal { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: var(--r); background: var(--t1a1b21); margin-bottom: 8px; }
.dtotal span { font-size: 12px; color: var(--muted); font-weight: 600; }
.dtotal b { font-size: 20px; font-weight: 800; }
.dlist { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.ditem { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--r); background: var(--t1f2330); width: 100%; text-align: left; transition: background .2s; }
.ditem:hover { background: var(--t262b3a); }
.dthumb { width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; background: var(--t0d0e13) center/cover no-repeat; }

.overlay--center { align-items: center; padding: 24px; }
.dialog { width: 100%; max-width: 340px; padding: 22px 20px 18px; border-radius: 22px; text-align: center;
  background: var(--t1a1d29); border: 1px solid var(--line-2); box-shadow: 0 20px 60px rgba(var(--shade),.6);
  transform: scale(.94); transition: transform .25s cubic-bezier(.16,1,.3,1); }
.overlay.open .dialog { transform: none; }
.dialog__ic { width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 999px; display: grid; place-items: center; color: var(--coral); background: rgba(255,59,92,.12); }
.dialog h3 { font-size: 17px; font-weight: 700; }
.dialog p { font-size: 13px; color: var(--muted); margin: 6px 0 18px; line-height: 1.5; }
.dialog__btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dialog__btns .btn { height: 44px; font-size: 14px; }

.overlay--viewer { align-items: center; background: rgba(0,0,0,.94); flex-direction: column; gap: 14px; padding: 60px 12px 24px; }
.overlay--viewer img { max-width: 100%; max-height: calc(100% - 50px); object-fit: contain; border-radius: 10px; }
.viewer__x { position: absolute; top: calc(12px + var(--sat)); right: 12px; z-index: 3; background: rgba(20,22,30,.75) !important; backdrop-filter: blur(6px); }
.viewer__spin { position: absolute; top: 50%; left: 50%; width: 32px; height: 32px; margin: -16px 0 0 -16px; }
#viewer-img:not([src]) { display: none; }

/* Fotos que se están cargando desde el servidor */
[data-foto].cargando { background-color: var(--t151821); background-image: linear-gradient(90deg, var(--t12151d) 25%, var(--t1c202b) 50%, var(--t12151d) 75%) !important;
  background-size: 200% 100% !important; animation: shimmer 1.4s infinite; }

/* ---------- Toast, estados vacíos, carga ---------- */
.toast { position: fixed; z-index: 70; left: 16px; right: 16px; max-width: 380px; margin: 0 auto;
  bottom: calc(var(--nav-h) + var(--sab) + 30px); display: flex; align-items: center; gap: 10px; padding: 12px 16px;
  border-radius: var(--r); background: var(--t1e2330); border: 1px solid var(--line-2); box-shadow: 0 12px 32px rgba(var(--shade),.5);
  opacity: 0; transform: translateY(14px); pointer-events: none; transition: opacity .3s, transform .3s; }
.toast.show { opacity: 1; transform: none; }
body.sub .toast { bottom: calc(var(--sab) + 20px); }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 36px 16px; gap: 8px; }
.empty__ic { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; margin-bottom: 6px;
  background: var(--surface-3); color: var(--coral); box-shadow: 0 4px 24px rgba(255,81,104,.15); }
.empty__ic .ms { font-size: 30px; }
.empty h3 { font-size: 17px; font-weight: 700; }
.empty p { font-size: 13px; color: var(--muted); max-width: 300px; line-height: 1.5; margin-bottom: 8px; }

.skel { border-radius: var(--r-lg); background: linear-gradient(90deg, var(--t12151d) 25%, var(--t1a1e29) 50%, var(--t12151d) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
.spin { width: 18px; height: 18px; border-radius: 999px; border: 2px solid rgba(var(--ink),.3); border-top-color: var(--text); animation: spin .8s linear infinite; }
.btn--primary .spin, .btn--danger-solid .spin, .fab .spin { border-color: rgba(255,255,255,.3); border-top-color: #fff; }

/* ---------- Momentos e historias ---------- */
.sec-t { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: -8px; }
.sbar { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 4px 16px 2px; }
.sbub { flex: 0 0 auto; width: 74px; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: transform .15s; }
.sbub:active { transform: scale(.94); }
.sbub__ring { width: 70px; height: 70px; border-radius: 999px; padding: 2.5px;
  background: conic-gradient(from 210deg, #FF3B5C, #ff8a3d, #fbbf24, #FF4B6E, #FF3B5C); box-shadow: 0 0 16px rgba(255,59,92,.25); }
.sbub.visto .sbub__ring { background: rgba(var(--ink),.2); box-shadow: none; }
.sbub__img { display: block; width: 100%; height: 100%; border-radius: 999px; border: 3px solid var(--bg); background: var(--t1b1f2b) center/cover no-repeat; }
.sbub__name { font-size: 11px; color: var(--text-2); max-width: 74px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sbub.visto .sbub__name { color: var(--muted-2); }

.tx__ic--story { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--coral); }

.dhero__ring { width: 64px; height: 64px; border-radius: 999px; padding: 2.5px; margin: 0 auto 12px; display: block;
  background: conic-gradient(from 210deg, #FF3B5C, #ff8a3d, #fbbf24, #FF4B6E, #FF3B5C); transition: transform .15s; }
.dhero__ring.visto { background: rgba(var(--ink),.25); }
.dhero__ring:active { transform: scale(.94); }
.dhero__av { display: block; width: 100%; height: 100%; border-radius: 999px; border: 3px solid var(--t121521); background: var(--t1b2030) center/cover no-repeat; }

.mstrip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.panel .mstrip { margin: 0 -14px; padding: 2px 14px; }
.mthumb { position: relative; flex: 0 0 78px; height: 104px; border-radius: 12px; overflow: hidden; display: block;
  background: var(--t1b1f2b) center/cover no-repeat; border: 1px solid var(--line-2); transition: transform .15s; }
button.mthumb:active { transform: scale(.95); }
.mthumb__x { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center;
  background: rgba(0,0,0,.65); color: #fff; }
.mthumb__x .ms { font-size: 15px; }
.mthumb__new { position: absolute; left: 4px; bottom: 4px; font-size: 9px; font-weight: 700; font-style: normal; text-transform: uppercase;
  letter-spacing: .05em; padding: 2px 5px; border-radius: 4px; background: var(--coral); color: #fff; }
.mthumb--add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted);
  background: rgba(var(--ink),.02); border: 1.5px dashed rgba(var(--ink),.18); font-size: 11px; font-weight: 600; }
.mthumb--add .ms { font-size: 24px; color: var(--coral); }
.mthumb--up { display: grid; place-items: center; background: linear-gradient(90deg, var(--t12151d) 25%, var(--t1c202b) 50%, var(--t12151d) 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite; }
.hint.sm { font-size: 12px; }

body.story-open { overflow: hidden; }
.story { position: fixed; inset: 0; z-index: 80; background: #000; display: flex; align-items: center; justify-content: center; animation: storyIn .25s ease; }
.story__frame { position: relative; width: 100%; height: 100%; max-width: 480px; overflow: hidden; background: #000;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
@media (min-width: 560px) { .story__frame { height: min(94vh, 880px); border-radius: 20px; } }
.story__bg { position: absolute; inset: -40px; background: center/cover no-repeat; filter: blur(32px) brightness(.4) saturate(1.2); }
.story__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .2s; pointer-events: none; }
.story__img.in { animation: storyImg .35s cubic-bezier(.16,1,.3,1); }
.story__spin { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; z-index: 2; }
.story__top, .story__foot { position: absolute; left: 0; right: 0; z-index: 3; transition: opacity .2s; }
.story__top { top: 0; padding: calc(10px + var(--sat)) 10px 36px; background: linear-gradient(rgba(0,0,0,.6), transparent); }
.story__bars { display: flex; gap: 4px; }
.story__bars i { flex: 1; height: 2.5px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
.story__bars b { display: block; height: 100%; width: 0; background: #fff; }
.story__head { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.story__av { width: 36px; height: 36px; border-radius: 999px; flex-shrink: 0; display: grid; place-items: center; border: 1.5px solid rgba(255,255,255,.85); }
.story__av .ms { font-size: 19px; }
.story__who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
.story__who b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.story__who span { font-size: 12px; color: rgba(255,255,255,.78); }
.story__btn { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; color: #fff; flex-shrink: 0; }
.story__btn:active { background: rgba(255,255,255,.15); }
.story__btn .ms { font-size: 22px; }
.story__foot { bottom: 0; padding: 48px 16px calc(20px + var(--sab)); background: linear-gradient(transparent, rgba(0,0,0,.75));
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.story__amt { font-size: 15px; font-weight: 700; padding: 5px 14px; border-radius: 999px; background: rgba(0,0,0,.4); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.15); }
.story__desc { font-size: 14px; color: rgba(255,255,255,.9); max-width: 360px; line-height: 1.45; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.story__desc:empty { display: none; }
.story__desc .ms { font-size: 15px; vertical-align: -3px; margin-right: 2px; }
.story__cta { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px;
  background: rgba(255,255,255,.14); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.22); }
.story__cta:active { transform: scale(.97); }
.story.oculto .story__top, .story.oculto .story__foot { opacity: 0; }
.overlay--center { z-index: 90; }
.toast { z-index: 95; }
@keyframes storyIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes storyImg { from { opacity: .4; transform: scale(1.03); } to { opacity: 1; transform: none; } }

/* ---------- Facturas escaneadas ---------- */
.c-scan { color: #a78bfa !important; }
.pill-rev { flex-shrink: 0; font-size: 9px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 999px;
  color: #fff; background: linear-gradient(135deg, var(--coral-2), var(--coral)); }
.alerta { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: var(--r-lg);
  background: linear-gradient(135deg, rgba(167,139,250,.16), rgba(255,59,92,.12)); border: 1px solid rgba(167,139,250,.35);
  box-shadow: 0 8px 24px rgba(var(--shade),.3); transition: transform .15s; }
.alerta:active { transform: scale(.99); }
.alerta b { font-size: 14px; }
.alerta .tx__main span { font-size: 12px; color: var(--muted); margin-top: 2px; }
.alerta__ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; background: rgba(167,139,250,.2); color: var(--tc4b5fd); }
.revbox { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-lg);
  background: rgba(167,139,250,.1); border: 1px solid rgba(167,139,250,.3); }
.revbox { flex-wrap: wrap; }
.revbox > .ms { color: var(--tc4b5fd); flex-shrink: 0; }
.revbox .tx__main { flex: 1 1 170px; }
.revbox b { font-size: 13px; }
.revbox .tx__main span { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: normal; }
.ftable { margin-top: 10px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.ftable__h, .ftable__r { display: grid; grid-template-columns: 1fr 44px 76px; gap: 8px; padding: 9px 12px; align-items: start; }
.ftable__h { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: rgba(var(--ink),.03); }
.ftable__r { font-size: 13px; border-top: 1px solid var(--line); }
.ftable__r small { display: block; font-size: 11px; color: var(--muted-2); margin-top: 1px; }
.ftable__h span:not(:first-child), .ftable__r span:not(:first-child) { text-align: right; }
.ftot { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.ftot div { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.ftot b { color: var(--text); font-weight: 500; }
.ftot__t { padding-top: 8px; border-top: 1px solid var(--line); }
.ftot__t span, .ftot__t b { font-size: 15px; font-weight: 700 !important; color: var(--text) !important; }
.iva-i { display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 5px; border-radius: 4px; vertical-align: 1px;
  font-size: 10px; font-weight: 800; font-style: normal; color: var(--tc4b5fd); background: rgba(167,139,250,.18); border: 1px solid rgba(167,139,250,.35); }
.iva-i--no { visibility: hidden; }
.iva-nota { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; font-size: 11px; color: var(--muted); }
.iva-nota .iva-i { margin-left: 0; }
.ftable__h, .ftable__r { grid-template-columns: 1fr 44px 92px !important; }
.fwarn { display: flex; gap: 6px; align-items: flex-start; margin-top: 10px; font-size: 12px; color: var(--amber); line-height: 1.4; }
.fwarn .ms { font-size: 16px; }

/* ---------- Detalle de factura plegable ---------- */
.fac__head { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.fac__ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; background: rgba(167,139,250,.14); color: var(--tc4b5fd); }
.fac__btn { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; padding: 6px 8px 6px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 600; color: var(--text); background: rgba(var(--ink),.06); border: 1px solid var(--line-2); }
.fac__btn .ms { font-size: 18px; transition: transform .3s; }
.fac.abierta .fac__btn .ms { transform: rotate(180deg); }
.fac__body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s cubic-bezier(.16,1,.3,1); }
.fac.abierta .fac__body { grid-template-rows: 1fr; }
.fac__in { overflow: hidden; min-height: 0; }
.fac.abierta .fac__in { padding-top: 6px; }

/* ---------- Hoja de aprobación ---------- */
.ap { display: flex; flex-direction: column; gap: 18px; }
.ap__res { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r); background: var(--t1f2330); }
.ap__thumb { width: 52px; height: 52px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; color: var(--muted); background: var(--t0d0e13) center/cover no-repeat; }
.ap__monto { font-size: 22px; font-weight: 800; color: var(--coral); letter-spacing: -.02em; }
.ap__sec { display: flex; flex-direction: column; gap: 10px; }
.ap__sec h4 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.ap__pista { display: flex; align-items: flex-start; gap: 8px; margin: 0; font-size: 13px; color: var(--text-2); line-height: 1.4; }
.ap__pista .ms { font-size: 18px; color: var(--tc4b5fd); }
.ap__grupo { display: flex; flex-direction: column; gap: 6px; }
.ap__gt { font-size: 11px; color: var(--muted-2); font-weight: 600; }
.ap__cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.acard { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; text-align: left; min-width: 0;
  background: rgba(var(--ink),.04); border: 1.5px solid rgba(var(--ink),.08); transition: border-color .2s, background .2s, transform .15s; }
.acard:active { transform: scale(.98); }
.acard.on { border-color: var(--coral); background: rgba(255,59,92,.08); box-shadow: 0 0 0 3px rgba(255,59,92,.12); }
.acard__sw { width: 34px !important; height: 34px !important; border-radius: 10px !important; }
.acard__sw .ms { font-size: 18px; }
.acard__txt { display: flex; flex-direction: column; min-width: 0; }
.acard__txt b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acard__txt span { font-size: 11px; color: var(--muted); }
.acard__sug { position: absolute; top: -8px; right: 8px; font-size: 9px; font-weight: 800; font-style: normal; letter-spacing: .05em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 999px; color: #1b1030; background: #c4b5fd; }
.acard__ok { position: absolute; bottom: 6px; right: 6px; font-size: 18px; color: var(--coral); opacity: 0; transition: opacity .2s; }
.acard.on .acard__ok { opacity: 1; }
.ap__add { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 8px 12px; border-radius: 10px;
  font-size: 13px; font-weight: 600; color: var(--text-2); border: 1.5px dashed rgba(var(--ink),.18); }
.ap__add .ms { font-size: 18px; color: var(--coral); }
.ap__duda { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: var(--r);
  background: rgba(251,191,36,.07); border: 1px solid rgba(251,191,36,.3); }
.ap__duda.neutra { background: rgba(var(--ink),.03); border-color: var(--line-2); }
.ap__dudat { display: flex; gap: 8px; align-items: flex-start; margin: 0; font-size: 13px; color: var(--tfde68a); line-height: 1.4; }
.ap__dudat .ms { font-size: 18px; color: var(--amber); }
.apops { display: flex; flex-direction: column; gap: 6px; }
.apop { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 10px 12px; border-radius: 10px; text-align: left;
  background: rgba(var(--ink),.04); border: 1.5px solid rgba(var(--ink),.08); }
.apop b { font-size: 14px; overflow-wrap: anywhere; }
.apop span { font-size: 11px; color: var(--muted); }
.apop.on { border-color: var(--coral); background: rgba(255,59,92,.08); }
.ap__okrow { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: var(--r); background: rgba(var(--ink),.04); border: 1px solid var(--line); }
.ap__okrow b { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ap__falta { margin: -4px 0 0; font-size: 12px; color: var(--amber); text-align: center; min-height: 0; }
.ap__falta:empty { display: none; }

/* ---------- Alias del comercio ---------- */
.dhero__oficial { font-size: 12px; color: var(--muted); margin: -1px 0 4px; letter-spacing: .01em; }
.ap__opc { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: none; color: var(--muted-2); margin-left: 4px; }

/* ---------- Acciones rápidas del detalle ---------- */
.qacts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 2px 0; }
.qact { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 4px 2px; font-size: 12px; font-weight: 600;
  color: var(--text-2); line-height: 1.2; text-align: center; transition: transform .15s, opacity .2s; }
.qact__ic { width: 54px; height: 54px; border-radius: 999px; display: grid; place-items: center;
  background: var(--t1b1f2c); border: 1px solid var(--line-2); color: var(--te2e8f0); box-shadow: 0 6px 18px rgba(var(--shade),.35); transition: background .2s, border-color .2s; }
.qact__ic .ms { font-size: 24px; }
.qact:hover .qact__ic { background: var(--t242a3a); }
.qact:active { transform: scale(.94); }
.qact--add .qact__ic { border-style: dashed; border-color: rgba(var(--ink),.25); color: var(--coral); background: transparent; }
.qact--danger { color: var(--coral); }
.qact--danger .qact__ic { color: var(--coral); background: rgba(255,59,92,.1); border-color: rgba(255,59,92,.3); }
.qact--danger:hover .qact__ic { background: rgba(255,59,92,.18); }
.qact:disabled { opacity: .4; }

/* ---------- Comprobante grande ---------- */
.comp { position: relative; display: block; width: 100%; height: 220px; border-radius: var(--r); overflow: hidden;
  background: var(--t0d0f15); border: 1px solid var(--line-2); text-align: left; }
.comp__img { position: absolute; inset: 0; background: var(--t0d0f15) center top/cover no-repeat; transition: transform .4s; }
.comp:hover .comp__img { transform: scale(1.02); }
.comp::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(9,10,15,.75), transparent 45%); pointer-events: none; }
.comp__tag { position: absolute; z-index: 1; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
  border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(0,0,0,.6); border: 1px solid var(--line-2); backdrop-filter: blur(6px); }
.comp__tag .ms { font-size: 17px; }
.comp--vacio { height: auto; padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  background: transparent; border: 1.5px dashed rgba(var(--ink),.18); }
.comp--vacio::after { display: none; }
.comp--vacio .ms { font-size: 30px; color: var(--coral); margin-bottom: 4px; }
.comp--vacio b { font-size: 14px; }
.comp--vacio span:last-child { font-size: 12px; color: var(--muted); }
.comp--up { height: 120px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; color: var(--muted); }
.comp--up::after { display: none; }

/* ---------- Visor con zoom ---------- */
.overlay--viewer { touch-action: none; overflow: hidden; user-select: none; -webkit-user-select: none; }
#viewer-img { transform-origin: center center; will-change: transform; -webkit-user-drag: none; -webkit-touch-callout: none; }
.overlay--viewer.zoom { cursor: grab; }
.viewer__hint { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,.55); transition: opacity .3s; }
.viewer__hint .ms { font-size: 17px; }
.overlay--viewer.zoom .viewer__hint, #viewer-img:not([src]) ~ .viewer__hint { opacity: 0; }

/* ---------- Eliminar ---------- */
.dellist { display: flex; flex-direction: column; gap: 8px; }
.delit { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r); background: var(--t1f2330); }
.delit__ic { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; color: var(--coral); background: rgba(255,59,92,.1); }
.delit__ic .ms { font-size: 20px; }
.delit .tx__main b { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.delit .tx__main span { font-size: 12px; color: var(--muted); margin-top: 1px; }
.delnote { display: flex; align-items: center; gap: 6px; margin: 14px 0 16px; font-size: 12px; color: var(--muted); }
.delnote .ms { font-size: 16px; }
.btn--danger-solid { color: #fff; background: var(--coral); box-shadow: 0 4px 20px rgba(255,59,92,.3); }
.btn--danger-solid:hover { background: #ff5370; }

/* ---------- Aviso con acción ---------- */
.toast__txt { flex: 1; min-width: 0; }
.toast__btn { flex-shrink: 0; margin: -6px -6px -6px 4px; padding: 8px 12px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--coral);
  background: rgba(255,59,92,.1); }
.toast__btn:active { transform: scale(.96); }
.toast.accion.show { pointer-events: auto; }

/* ---------- Menú del botón + ---------- */
.opcs { display: flex; flex-direction: column; gap: 10px; }
.opc { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--r-lg); text-align: left; width: 100%;
  background: var(--t1f2330); border: 1px solid var(--line); transition: background .2s, transform .15s; }
.opc:hover { background: var(--t262b3a); }
.opc:active { transform: scale(.99); }
.opc__ic { width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--coral-2), var(--coral)); box-shadow: 0 4px 14px rgba(255,59,92,.3); }
.opc--mom .opc__ic { background: conic-gradient(from 210deg, #FF3B5C, #ff8a3d, #fbbf24, #FF4B6E, #FF3B5C); }
.opc .tx__main b { font-size: 15px; }
.opc .tx__main span { font-size: 12px; color: var(--muted); margin-top: 2px; }

  <script>
'use strict';
/* =========================================================
   Mis Finanzas — Lógica de la app (navegador)
   ---------------------------------------------------------
   Dentro de Apps Script usa google.script.run para hablar con
   Code.gs. Si se abre fuera de Apps Script (vista previa),
   usa datos de ejemplo en memoria.
   ========================================================= */

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const MES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const DIA_C = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DIA_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const COLORES = ['plata', 'negro', 'emerald', 'indigo', 'amber', 'coral', 'slate'];

const fechaStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoyStr = () => fechaStr(new Date());
const ayerStr = () => { const d = new Date(); d.setDate(d.getDate() - 1); return fechaStr(d); };
const horaAhora = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const toDate = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const money = n => '$' + Math.abs(Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = n => '$' + Math.round(Math.abs(Number(n) || 0)).toLocaleString('en-US');
const signo = m => (m.tipo === 'Ingreso' ? '+' : '-') + money(m.monto);
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const msgErr = e => String((e && e.message) || e || 'Error desconocido').replace(/^(Exception|Error):\s*/i, '');

function hexA(hex, a) {
  let h = String(hex || '').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  if (isNaN(n) || h.length !== 6) return `rgba(148,163,184,${a})`;
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function fechaLarga(f) {
  const d = toDate(f);
  return `${DIA_L[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()}`;

/* ---------- Conexión con el servidor ----------
   gas      → abierta desde Apps Script (implementación "Solo yo"): google.script.run
   web      → app web instalada (GitHub Pages): pedidos al motor con la clave secreta
   demo     → vista previa local con datos de ejemplo
   vincular → app web todavía sin vincular */
const EN_APPS_SCRIPT = typeof google !== 'undefined' && google.script && google.script.run;
const CLAVE_GAS = window.__MF_CLAVE || '';
const b64urlDecode = t => decodeURIComponent(escape(atob(String(t).split('-').join('+').split('_').join('/'))));
let VINCULO_NUEVO = false;
function leerVinculo() {
  try {
    const m = String(location.hash || '').match(/[#&]v=([\w-]+)/);
    if (m) {
      const o = JSON.parse(b64urlDecode(m[1]));
      if (o && o.u && o.k) {
        const previo = localStorage.getItem('mf-api');
        localStorage.setItem('mf-api', JSON.stringify({ u: o.u, k: o.k }));
        VINCULO_NUEVO = previo !== JSON.stringify({ u: o.u, k: o.k });
        return { u: o.u, k: o.k };
      }
    }
  } catch (e) { /* enlace inválido */ }
  try { return JSON.parse(localStorage.getItem('mf-api') || 'null'); } catch (e) { return null; }
}
const VINCULO = EN_APPS_SCRIPT ? null : leerVinculo();
const MODO = EN_APPS_SCRIPT ? 'gas' : VINCULO ? 'web'
  : (location.protocol === 'file:' || /[?&]demo\b/.test(location.search)) ? 'demo' : 'vincular';
const ES_STANDALONE = !!(window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));

function llamar(fn, ...args) {
  if (MODO === 'demo') return Demo[fn](...args);
  if (MODO === 'gas') {
    return new Promise((ok, falla) => {
      google.script.run
        .withSuccessHandler(ok)
        .withFailureHandler(e => falla(e instanceof Error ? e : new Error(msgErr(e))))
        .api(CLAVE_GAS, fn, args);
    });
  }
  if (MODO === 'web') return llamarMotor(fn, args);
  return Promise.reject(Object.assign(new Error('Este dispositivo no está vinculado.'), { codigo: 'clave' }));
}

/** Pedido al motor de Apps Script (POST de texto: no requiere permisos CORS especiales). */
async function llamarMotor(fn, args) {
  let r;
  try {
    r = await fetch(VINCULO.u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ clave: VINCULO.k, accion: fn, args }) });
  } catch (e) {
    throw new Error('Sin conexión con el motor. Revisa tu internet.');
  }
  let d = null;
  try { d = await r.json(); } catch (e) { /* no es JSON */ }
  if (!d) throw new Error('El motor no respondió bien. Revisa que la implementación tenga acceso "Cualquier usuario".');
  if (!d.ok) throw Object.assign(new Error(d.error || 'Error del motor'), { codigo: d.codigo || '' });
  return d.data;
}

/* ---------- Fotos ----------
   Se piden al servidor (getFoto) y se guardan en memoria, así no dependen
   de enlaces públicos de Drive y se ven en cualquier navegador. */
const FOTOS = {};      // id → data URL
const PENDIENTES = {}; // id → promesa en curso
function pedirFoto(id) {
  if (FOTOS[id]) return Promise.resolve(FOTOS[id]);
  if (!PENDIENTES[id]) {
    PENDIENTES[id] = API.getFoto(id).then(
      src => { FOTOS[id] = src; delete PENDIENTES[id]; return src; },
      e => { delete PENDIENTES[id]; throw e; });
  }
  return PENDIENTES[id];
}
function ponerFoto(el, src) {
  el.classList.remove('cargando');
  if (el.tagName === 'IMG') el.src = src; else el.style.backgroundImage = `url("${src}")`;
  if (el.classList.contains('clogo')) marcarLogo(el, src);
}

/* Logos claros (p. ej. blancos con fondo transparente): sin placa blanca en tarjetas oscuras
   y en oscuro sobre la tarjeta plata, para que siempre se vean. */
const LOGO_CLARO = {};
function esLogoClaro(src) {
  if (LOGO_CLARO[src] !== undefined) return Promise.resolve(LOGO_CLARO[src]);
  return new Promise(ok => {
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, 64 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        const g = c.getContext('2d');
        g.drawImage(img, 0, 0, c.width, c.height);
        const d = g.getImageData(0, 0, c.width, c.height).data;
        let n = 0, luz = 0, transp = 0;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] > 40) { n++; luz += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255; } else transp++;
        }
        // Claro = casi todo lo visible es claro y la imagen tiene transparencia
        LOGO_CLARO[src] = n > 0 && luz / n > 0.82 && transp > 0;
      } catch (e) { LOGO_CLARO[src] = false; }
      ok(LOGO_CLARO[src]);
    };
    img.onerror = () => ok(false);
    img.src = src;
  });
}
function marcarLogo(el, src) {
  esLogoClaro(src).then(claro => el.classList.toggle('claro', claro));
}
function marcarLogos(raiz) {
  $$('.clogo', raiz).forEach(el => {
    const m = String(el.style.backgroundImage || '').match(/^url\(["']?(.*?)["']?\)$/);

  });
}
function pintarFotos(raiz = document) {
  $$('[data-foto]', raiz).forEach(el => {
    const id = el.dataset.foto;
    if (!id) return;
    if (FOTOS[id]) return ponerFoto(el, FOTOS[id]);
    el.classList.add('cargando');
    pedirFoto(id)
      .then(src => $$('[data-foto]').filter(x => x.dataset.foto === id).forEach(x => ponerFoto(x, src)))
      .catch(() => el.classList.remove('cargando'));
  });
}

  const sel = S.filtroCuenta === c.id, dim = S.filtroCuenta && !sel;
  const lim = Number(c.limite) || 0;
  const p = lim > 0 ? gastado / lim : (totalGastos > 0 ? gastado / totalGastos : 0);
  const derecha = lim > 0 ? `Límite: ${money0(lim)}` : `${Math.round(p * 100)}% del gasto`;
  const efectivo = c.tipo === 'Efectivo';
  const arte = !efectivo && ({ 'Visa': 'visa', 'Mastercard': 'mastercard', 'Diners Club': 'diners' })[marcaDe(c)];
  const disponible = lim > 0 ? lim - gastado : null;
  const [ay, am] = S.month.split('-').map(Number);
  const mesTxt = MES_C[am - 1];
  // Número como lo muestra el banco: primeros 4 + asteriscos + últimos 4 (Diners tiene 14 dígitos)
  const ocultos = marcaDe(c) === 'Diners Club' ? 6 : marcaDe(c) === 'American Express' ? 7 : 8;
  const numero = efectivo ? 'Dinero en efectivo'
    : c.ultimos4 ? `${esc(c.primeros4 || '****')}${'*'.repeat(ocultos)}${esc(c.ultimos4)}` : esc(c.tipo);
  // Fecha de pago: el próximo día de pago a partir de hoy
  let fechaPago = 'Sin definir';
  let etiqueta = c.tipo === 'Crédito' ? `Gastado en ${mesTxt}` : `Consumos de ${mesTxt}`;
  if (c.tipo === 'Crédito' && c.diaPago) {
    const h = new Date(), dia = Number(c.diaPago);
    let f = new Date(h.getFullYear(), h.getMonth(), dia);
    if (f < new Date(h.getFullYear(), h.getMonth(), h.getDate())) f = new Date(h.getFullYear(), h.getMonth() + 1, dia);
    fechaPago = `${pad(f.getDate())} ${MES_C[f.getMonth()]}`;
    etiqueta += ` · paga hasta ${pad(f.getDate())} ${MES_C[f.getMonth()]}`;
  }
  if (arte) return `<button class="ccard tcard tcard--art ${sel ? 'is-selected' : ''} ${dim ? 'is-dimmed' : ''}" data-act="filtro-cuenta" data-id="${esc(c.id)}" aria-pressed="${sel}" aria-label="${esc(c.nombre)}, ${numero}, fecha de pago ${fechaPago}, valor ${money(gastado)}">
    <img class="tcard__art" src="assets/tarjetas/${arte}.png" alt="" decoding="async">
    <span class="tcard__details">
      <span class="tcard__code num">${numero}</span>
      <span class="tcard__payment">Fecha de pago · ${fechaPago}</span>
      <b class="tcard__value num">${money(gastado)}</b>
    </span>
  </button>`;
  return `<button class="ccard tcard ${arte ? 'tcard--art' : ''} ccard--${esc(c.color || 'emerald')} ${sel ? 'is-selected' : ''} ${dim ? 'is-dimmed' : ''}" data-act="filtro-cuenta" data-id="${esc(c.id)}"
      aria-label="${esc(c.nombre)}${c.ultimos4 ? ' terminada en ' + esc(c.ultimos4) : ''}: ${c.tipo === 'Crédito' ? 'gastado' : 'consumos'} ${money(gastado)}${lim > 0 ? ' de ' + money0(lim) : ''}">
    ${arte ? `<img class="tcard__art" src="assets/tarjetas/${arte}.png" alt="${esc(marcaDe(c))}" decoding="async"><span class="tcard__details">` : '<span class="ccard__shine"></span><span class="ccard__tex"></span>'}
    <span class="tcard__top"><b class="tcard__name">${esc(c.nombre)}</b>${sel ? '<span class="ccard__badge">ACTIVA</span>' : ''}</span>
    <span class="tcard__num num">${numero}</span>
    <span class="tcard__bottom">
      <span class="tcard__amt"><small>${etiqueta}</small><b class="num">${money(gastado)}</b>
        ${lim > 0 ? `<em>Límite ${money0(lim)} · ${disponible >= 0 ? 'disponible ' + money0(disponible) : 'excedido'}</em>` : `<em>${derecha}</em>`}</span>
      <span class="tcard__logo">${arte ? '' : efectivo ? `<span class="ms">${iconoCuenta(c)}</span>` : logoCuenta(c, 'lg')}</span>
    </span>
    ${lim > 0 ? `<span class="bar"><i data-w="${Math.min(100, p * 100).toFixed(1)}%"></i></span>` : ''}
    ${arte ? '</span>' : ''}
  </button>`;
}


/* =========================================================
   Gráficos de Inicio
   1. Gasto por categoría: anillo + % de cada categoría sobre el total de gastos
   2. Tendencia: total de gastos de los últimos 6 meses
   Respetan la tarjeta elegida en "Gastos por tarjeta". Incluyen facturas por revisar.
   ========================================================= */
const COLOR_OTROS = '#64748b';
const MAX_CATS = 6;   // si hay más, se muestran 5 y el resto va a "Otros"
const mesesAtras = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 - n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const gastosDeMes = ym => S.movs.filter(m => m.tipo === 'Gasto' && m.fecha.startsWith(ym) && (!S.filtroCuenta || m.cuenta === S.filtroCuenta));
const sumar = lista => lista.reduce((t, m) => t + (Number(m.monto) || 0), 0);
function montoCorto(n) {
  n = Math.abs(n);
  if (n >= 1000) { const k = n / 1000; return (k >= 10 ? Math.round(k) : Math.round(k * 10) / 10) + 'K'; }
  return String(Math.round(n));
}

/** Porcentajes por categoría que suman exactamente 100 (método del mayor residuo). */
function resumenCategorias(gastos) {
  const total = sumar(gastos);
  const porCat = {};
  const info = {};
  // Con categorías principales se agrupa por ellas; si no, por categoría
  gastos.forEach(m => {
    const n = m.categoria || 'Sin categoría', g = grupoDeCat(n);
    const k = g ? g.nombre : n;
    const x = info[k] = info[k] || { nombre: k, monto: 0, cats: [], subs: {}, color: g ? g.color : cat(n).color, grupo: !!g };
    x.monto += Number(m.monto) || 0;
    x.subs[n] = (x.subs[n] || 0) + (Number(m.monto) || 0);
    if (!x.cats.includes(n)) x.cats.push(n);
  });
  let items = Object.values(info).filter(x => x.monto > 0).sort((a, b) => b.monto - a.monto);
  if (items.length > MAX_CATS) {
    const resto = items.slice(MAX_CATS - 1);
    const subs = {};
    resto.forEach(x => { subs[x.nombre] = x.monto; });
    items = items.slice(0, MAX_CATS - 1).concat({ nombre: 'Resto', otros: true, monto: sumar(resto),
      cats: [].concat(...resto.map(x => x.cats)), subs, color: COLOR_OTROS });
  }
  if (total > 0) {
    const crudos = items.map(x => x.monto / total * 100);
    items.forEach((x, i) => { x.pct = Math.floor(crudos[i]); });
    let falta = 100 - items.reduce((t, x) => t + x.pct, 0);
    crudos.map((v, i) => ({ i, r: v - Math.floor(v) })).sort((a, b) => b.r - a.r)
      .forEach(({ i }) => { if (falta > 0) { items[i].pct++; falta--; } });
  }
  return { total, items };
}

function anillo(res) {
  const R = 78, C = 2 * Math.PI * R, GAP = res.items.length > 1 ? 5 : 0;
  let ini = 0;
  const segs = res.items.map((x, i) => {
    const largo = x.monto / res.total * C;
    const visible = Math.max(1.5, largo - GAP);
    const off = -(ini + GAP / 2);
    ini += largo;
    const dim = S.catSel && S.catSel !== x.nombre;
    return `<circle class="donut__seg ${dim ? 'dim' : ''}" cx="100" cy="100" r="${R}" stroke="${esc(x.color)}"
      stroke-dasharray="0 ${C.toFixed(2)}" data-da="${visible.toFixed(2)} ${(C - visible).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"
      data-act="cat-sel" data-v="${esc(x.nombre)}" style="transition-delay:${i * 70}ms"><title>${esc(x.nombre)} ${x.pct}%</title></circle>`;
  }).join('');
  const sel = S.catSel && res.items.find(x => x.nombre === S.catSel);
  const centro = sel
    ? `<b class="num">${money(sel.monto)}</b><span>${esc(sel.nombre)} · ${sel.pct}%</span>`
    : `<b class="num">${money(res.total)}</b><span>Total gastado</span>`;
  const resumen = res.items.map(x => `${x.nombre} ${x.pct}%`).join(', ');
  return `<div class="donut" role="img" aria-label="Gasto total ${money(res.total)}: ${esc(resumen)}">
      <svg viewBox="0 0 200 200"><circle class="donut__bg" cx="100" cy="100" r="${R}"></circle>${segs}</svg>
      <div class="donut__c">${centro}</div></div>`;
}

/** Compara con el mes anterior. Si es el mes en curso, compara hasta el mismo día. */
function comparacionMes(total) {
  const prevYm = mesesAtras(S.month, 1);
  const info = infoMes();
  let prev = gastosDeMes(prevYm);
  let etiqueta = MESES[Number(prevYm.slice(5)) - 1].toLowerCase();
  if (info.actual) {
    const dia = new Date().getDate();
    prev = prev.filter(m => Number(m.fecha.slice(8, 10)) <= dia);
    etiqueta = `${etiqueta} a esta fecha`;
  }
  const p = sumar(prev);
  if (!(p > 0) || !(total > 0)) return '';
  const dif = Math.round((total - p) / p * 100);
  const [ic, cls, txt] = dif === 0 ? ['trending_flat', 'igual', `Gastas lo mismo que en ${etiqueta}`]
    : dif < 0 ? ['trending_down', 'baja', `Gastas ${Math.abs(dif)}% menos que en ${etiqueta}`]
    : ['trending_up', 'sube', `Gastas ${dif}% más que en ${etiqueta}`];
  return `<div class="cmp cmp--${cls}"><span class="cmp__ic"><span class="ms">${ic}</span></span>
      <span class="tx__main"><b>${txt}</b><span>${money(total)} este mes · ${money(p)} en ${etiqueta}</span></span></div>`;
}

function panelCategorias() {
  const res = resumenCategorias(gastosDeMes(S.month));
  if (S.catSel && !res.items.some(x => x.nombre === S.catSel)) S.catSel = null;
  const sub = S.filtroCuenta ? `<div class="panel__sub"><i></i>${esc(cuentaLabel(S.filtroCuenta))}</div>` : '<div class="panel__sub">Toca una categoría para ver sus movimientos</div>';
  if (!res.total) {
    return `<section class="panel fade-up d2" id="p-cats"><div class="panel__head"><div><h2 class="panel__title">Gasto por categoría</h2>${S.filtroCuenta ? sub : ''}</div></div>
      <div class="donut donut--vacio"><svg viewBox="0 0 200 200"><circle class="donut__bg" cx="100" cy="100" r="78"></circle></svg>
        <div class="donut__c"><b class="num">$0.00</b><span>Aún no hay gastos este mes</span></div></div></section>`;
  }
  const leyenda = res.items.map(x => `<button class="leg ${S.catSel && S.catSel !== x.nombre ? 'dim' : ''}" data-act="cat-ir" data-v="${esc(x.nombre)}"
      aria-label="${esc(x.nombre)}: ${x.pct}%, ${money(x.monto)}. Ver movimientos">
      <i style="background:${esc(x.color)}"></i><span class="leg__n">${esc(x.nombre)}</span><b class="num">${x.pct}%</b></button>`).join('');
  const sel = S.catSel && res.items.find(x => x.nombre === S.catSel);
  const desglose = sel && Object.keys(sel.subs).length > 1 ? (() => {
    const filas = Object.keys(sel.subs).map(n => ({ n, v: sel.subs[n] })).sort((a, b) => b.v - a.v);
    return `<div class="desg"><h4>${esc(sel.nombre)} por subcategoría</h4>${filas.map(f => {
      const p = Math.round(f.v / sel.monto * 100), c = cat(f.n);
      return `<div class="desg__r"><span class="desg__n"><i style="background:${esc(c.color)}"></i>${esc(f.n)}</span>
        <span class="bbar"><i style="width:${p}%;background:${esc(c.color)}"></i></span><b class="num">${money(f.v)}</b><em>${p}%</em></div>`;
    }).join('')}</div>`;
  })() : '';
  return `<section class="panel fade-up d2" id="p-cats">
    <div class="panel__head"><div><h2 class="panel__title">Gasto por categoría</h2>${sub}</div>
      <button class="link" data-act="ir-categorias">Categorías<span class="ms">chevron_right</span></button></div>
    ${anillo(res)}
    <div class="legs">${leyenda}</div>
    ${desglose}
    ${comparacionMes(res.total)}
  </section>`;
}

function panelTendencia() {
  const meses = Array.from({ length: 6 }, (_, i) => mesesAtras(S.month, 5 - i));
  const tot = meses.map(ym => sumar(gastosDeMes(ym)));
  const max = Math.max(...tot);
  // Escala "redonda": pasos de 1, 2, 2.5 o 5 × 10ⁿ
  let paso = 1;
  if (max > 0) {
    const bruto = max / 3, e = Math.pow(10, Math.floor(Math.log10(bruto)));
    paso = [1, 2, 2.5, 5, 10].map(k => k * e).find(v => v >= bruto);
  }
  const tope = max > 0 ? Math.ceil(max / paso) * paso : 1;
  const marcas = [];
  for (let v = 0; v <= tope + 1e-9; v += paso) marcas.push(v);
  const lineas = marcas.map(v => `<span class="trend__gl" style="bottom:${v / tope * 100}%"><em>${v ? montoCorto(v) : '0'}</em></span>`).join('');
  const barras = meses.map((ym, i) => {
    const sel = ym === S.month, h = tot[i] / tope * 100;
    const nombre = MESES[Number(ym.slice(5)) - 1];
    return `<button class="trend__col ${sel ? 'on' : ''}" data-act="mes-ir" data-v="${ym}" aria-label="${nombre}: ${money(tot[i])}" ${sel ? 'aria-current="true"' : ''}>
      <span class="trend__bar ${tot[i] ? '' : 'cero'}" data-h="${Math.max(tot[i] ? 2 : 0, h).toFixed(1)}%">${sel && tot[i] ? `<span class="trend__val num">${money(tot[i])}</span>` : ''}</span>
      <span class="trend__m">${cap(MES_C[Number(ym.slice(5)) - 1])}</span></button>`;
  }).join('');
  const prom = sumar(tot.filter(Boolean).map(v => ({ monto: v }))) / (tot.filter(Boolean).length || 1);
  return `<section class="panel fade-up d3">
    <div class="panel__head"><div><h2 class="panel__title">Tendencia de gastos</h2>
      <div class="panel__sub">${max ? `Promedio ${money(prom)} al mes · toca un mes para verlo` : 'Últimos 6 meses'}</div></div></div>
    <div class="trend"><div class="trend__plot">${lineas}<div class="trend__cols">${barras}</div></div></div>
  </section>`;
}

function refrescarCategorias() {
  const el = $('#p-cats');

  const tmp = document.createElement('div');
