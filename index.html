/* =========================================================
   VISTA: Budget (presupuesto mensual)
   Ingreso base = 100 %. Rubros: monto fijo o % del ingreso.
   Gasto → se compara con lo gastado en sus categorías.
   Ahorro → se marca "Apartado" cada mes.
   Disponible = ingreso − asignado − gasto libre − excesos de rubros.
   ========================================================= */
const B_ICONOS = ['home', 'shopping_basket', 'restaurant', 'subscriptions', 'savings', 'directions_car', 'school', 'medical_services',
  'bolt', 'fitness_center', 'pets', 'flight', 'checkroom', 'child_care', 'payments', 'celebration'];
const B_COLORES = ['#38bdf8', '#ff7a8f', '#c084fc', '#00D09C', '#fbbf24', '#fb923c', '#818cf8', '#94a3b8'];
const pctTxt = v => (Math.round(v * 10) / 10).toLocaleString('en-US', { maximumFractionDigits: 1 }) + '%';
const montoRubro = (r, ingreso) => r.modo === 'Porcentaje' ? Math.round(ingreso * r.valor) / 100 : Number(r.valor) || 0;

function calcBudget() {
  const B = S.budget, ingreso = Number(B.ingreso) || 0, ym = S.month;
  const gastos = S.movs.filter(m => m.tipo === 'Gasto' && m.fecha.startsWith(ym));
  const vinculadas = new Set();
  const rubros = B.rubros.map(r => {
    const monto = montoRubro(r, ingreso);
    const x = Object.assign({}, r, { monto, pct: ingreso > 0 ? monto / ingreso * 100 : 0 });
    if (r.tipo === 'Gasto') {
      r.categorias.forEach(c => vinculadas.add(c));
      x.gastado = sumar(gastos.filter(m => r.categorias.includes(m.categoria)));
      x.exceso = Math.max(0, x.gastado - monto);
    } else {
      x.apartado = B.apartados.some(a => a.mes === ym && a.rubroId === r.id);
    }
    return x;
  });
  const asignado = rubros.reduce((t, r) => t + r.monto, 0);
  const movsLibres = gastos.filter(m => !vinculadas.has(m.categoria || 'Sin categoría'));
  const gastoLibre = sumar(movsLibres);
  const excesos = rubros.reduce((t, r) => t + (r.exceso || 0), 0);
  const libre = ingreso - asignado;
  const disponible = libre - gastoLibre - excesos;
  const info = infoMes();
  const [y, m] = ym.split('-').map(Number);
  const dias = info.actual ? info.quedan : info.pasado ? 0 : new Date(y, m, 0).getDate();
  return {
    ingreso, rubros, asignado, libre, gastoLibre, excesos, disponible, dias, info,
    porDia: dias > 0 && disponible > 0 ? disponible / dias : 0,
    pctLibre: ingreso > 0 ? Math.round(disponible / ingreso * 100) : 0,
    catsLibres: Array.from(new Set(movsLibres.map(x => x.categoria || 'Sin categoría')))
  };
}

function barraBudget(c) {
  if (!(c.ingreso > 0)) return '';
  const w = v => Math.max(0, Math.min(100, v / c.ingreso * 100));
  const a = w(c.asignado), g = Math.min(100 - a, w(c.gastoLibre + c.excesos)), d = Math.min(100 - a - g, w(c.disponible));
  return `<span class="bstack" aria-hidden="true"><i class="a" style="width:${a}%"></i><i class="g" style="width:${g}%"></i><i class="d" style="width:${d}%"></i></span>`;
}

      <p class="bhero__de">de <button class="bhero__ing" data-act="b-ingreso" aria-label="Editar ingreso mensual"><b class="num">${money(c.ingreso)}</b><span class="ms">edit</span></button> de ingreso${porDia}</p>

function filaRubro(r) {
  const sub = (r.modo === 'Porcentaje' ? `${pctTxt(r.valor)} del ingreso` : 'Monto fijo') +
    (r.tipo === 'Gasto' ? (r.categorias.length ? ' · ' + r.categorias.join(', ') : ' · sin categorías') : ' · Ahorro');
  let barra, estado, accion = '';
  if (r.tipo === 'Gasto') {
    const p = r.monto > 0 ? r.gastado / r.monto * 100 : (r.gastado ? 100 : 0);
    const cls = r.exceso > 0 ? 'over' : p >= 85 ? 'warn' : '';
    barra = `<span class="bbar"><i style="width:${Math.min(100, p)}%;background:${r.exceso > 0 ? 'var(--coral)' : esc(r.color)}"></i></span>`;
    estado = `<span class="brow__st ${cls}">${r.exceso > 0 ? `Excedido por ${money(r.exceso)}` : `Gastado ${money(r.gastado)} · te quedan ${money(r.monto - r.gastado)}`}</span>`;
    if (r.categorias.length) accion = `<button class="link brow__lk" data-act="rb-movs" data-id="${esc(r.id)}">Ver movimientos<span class="ms">chevron_right</span></button>`;
  } else {
    barra = `<span class="bbar"><i style="width:${r.apartado ? 100 : 0}%;background:${esc(r.color)}"></i></span>`;
    estado = `<span class="brow__st ${r.apartado ? 'ok' : ''}">${r.apartado ? `${money(r.monto)} apartados este mes` : 'Pendiente de apartar este mes'}</span>`;
    accion = `<button class="btn-sm brow__ap ${r.apartado ? 'on' : ''}" data-act="rb-apartar" data-id="${esc(r.id)}" aria-pressed="${r.apartado}">
      <span class="ms ${r.apartado ? 'fill' : ''}">${r.apartado ? 'check_circle' : 'savings'}</span>${r.apartado ? 'Apartado' : 'Marcar como apartado'}</button>`;
  }
  return `<div class="brow" role="button" tabindex="0" data-act="rb-editar" data-id="${esc(r.id)}">
    <span class="brow__ic" style="color:${esc(r.color)};background:${hexA(r.color, .12)};border-color:${hexA(r.color, .25)}"><span class="ms">${esc(r.icono)}</span></span>
    <span class="brow__main">
      <span class="brow__top"><b>${esc(r.nombre)}</b><span class="num">${money(r.monto)} <em>(${pctTxt(r.pct)})</em></span></span>
      <span class="brow__sub">${esc(sub)}</span>
      ${barra}
      <span class="brow__foot">${estado}${accion}</span>
    </span></div>`;
}

async function iniciarBudget(btn, conEjemplo) {
  const v = parseFloat(String(($('#b-ini') || {}).value || '').replace(',', '.').replace(/[^\d.]/g, ''));
  if (!(v > 0)) { aviso('Escribe tu ingreso mensual', 'error', true); const i = $('#b-ini'); if (i) i.focus(); return; }
  ocupado(btn, true, 'Creando…');
  try {
    S.budget = await API.iniciarPresupuesto(v, conEjemplo);
    render();
    aviso(conEjemplo ? 'Budget creado: ajusta los rubros a tu medida' : 'Ingreso guardado: añade tus rubros', 'pie_chart');

}

/* ---------- Rubro: crear / editar ---------- */
function abrirRubro(id) {
  const r = id ? S.budget.rubros.find(x => x.id === id) : null;
  S.rf = r ? Object.assign({}, r, { valor: String(r.valor), categorias: r.categorias.slice() })
    : { id: null, nombre: '', icono: 'savings', color: B_COLORES[S.budget.rubros.length % B_COLORES.length], modo: 'Monto', valor: '', tipo: 'Gasto', categorias: [] };
  abrirSheet(formRubro());
}
function equivalenciaRubro() {
  const f = S.rf, ing = Number(S.budget.ingreso) || 0;
  const v = parseFloat(String(f.valor).replace(',', '.'));
  if (!(v > 0)) return f.modo === 'Porcentaje' ? `Porcentaje de tu ingreso de ${money(ing)}` : `Monto fijo cada mes`;
  return f.modo === 'Porcentaje' ? `${pctTxt(v)} = ${money(ing * v / 100)} de tu ingreso de ${money(ing)}` : `${money(v)} = ${pctTxt(ing ? v / ing * 100 : 0)} de tu ingreso`;
}
function formRubro() {
  const f = S.rf, gasto = f.tipo === 'Gasto';
  const usadas = {};
  S.budget.rubros.forEach(r => { if (r.id !== f.id) r.categorias.forEach(c => { usadas[c] = r.nombre; }); });
  const cats = selectorCategorias({ sel: f.categorias, act: 'rf-cat', usadas, grupoAct: 'rf-grupo' });
  return `<div class="sheet__head"><div><h3>${f.id ? 'Editar rubro' : 'Nuevo rubro'}</h3><p>Parte de tu ingreso de ${money(S.budget.ingreso)}</p></div>

    <div class="stack sm">
      <div class="field"><label for="rf-nombre">Nombre</label><input id="rf-nombre" class="input" data-rf="nombre" value="${esc(f.nombre)}" placeholder="Ej. Vivienda" maxlength="60" autocomplete="off"></div>
      <div class="field"><label>Tipo</label><div class="seg seg--sm">
        <button class="${gasto ? 'on' : ''}" data-act="rf-tipo" data-v="Gasto"><span class="ms">shopping_bag</span>Gasto</button>
        <button class="${!gasto ? 'on ahorro' : ''}" data-act="rf-tipo" data-v="Ahorro"><span class="ms">savings</span>Ahorro</button></div></div>
      <div class="field"><label>¿Cómo lo defines?</label><div class="seg seg--sm">
        <button class="${f.modo === 'Monto' ? 'on' : ''}" data-act="rf-modo" data-v="Monto">Monto $</button>
        <button class="${f.modo === 'Porcentaje' ? 'on' : ''}" data-act="rf-modo" data-v="Porcentaje">Porcentaje %</button></div></div>
      <div class="field"><label for="rf-valor">${f.modo === 'Porcentaje' ? 'Porcentaje del ingreso' : 'Monto mensual'}</label>
        <div class="rfval"><span>${f.modo === 'Porcentaje' ? '%' : '$'}</span><input id="rf-valor" class="input num" data-rf="valor" inputmode="decimal" value="${esc(f.valor)}" placeholder="${f.modo === 'Porcentaje' ? '10' : '200'}" autocomplete="off"></div>
        <p class="hint sm" id="rf-eq">${esc(equivalenciaRubro())}</p></div>
      ${gasto ? `<div class="field"><label>Categorías de este rubro</label>${cats}
        <p class="hint sm">Lo que gastes en estas categorías se descuenta de este rubro. Cada categoría va en un solo rubro.</p></div>` : `<p class="hint sm">El ahorro no se descuenta de tus gastos: cada mes lo marcas como "Apartado" cuando lo separes.</p>`}
      <div class="field"><label>Icono</label><div class="bicons">${B_ICONOS.map(i => `<button class="bicon ${f.icono === i ? 'on' : ''}" data-act="rf-icono" data-v="${i}" aria-label="${i}"><span class="ms">${i}</span></button>`).join('')}</div></div>
      <div class="field"><label>Color</label><div class="swatches">${B_COLORES.map(k => `<button class="sw ${f.color === k ? 'on' : ''}" style="background:${k}" data-act="rf-color" data-v="${k}" aria-label="Color ${k}"></button>`).join('')}</div></div>
      <button class="btn btn--primary" data-act="rf-guardar"><span class="ms">check</span>${f.id ? 'Guardar cambios' : 'Añadir rubro'}</button>
      ${f.id ? '<button class="btn btn--danger" data-act="rf-eliminar"><span class="ms">delete</span>Eliminar rubro</button>' : ''}
    </div>`;
}
function refrescarRubro() {
  const body = $('#sheet-body'), hoja = body.parentElement, y = hoja.scrollTop;
  body.innerHTML = formRubro();
  hoja.scrollTop = y;
}
async function guardarRubroActual(btn) {
  const f = S.rf;
  const valor = parseFloat(String(f.valor).replace(',', '.').replace(/[^\d.]/g, ''));
  if (!String(f.nombre).trim()) return aviso('Escribe el nombre del rubro', 'error', true);
  if (!(valor > 0)) return aviso('Escribe un valor mayor a cero', 'error', true);
  if (f.modo === 'Porcentaje' && valor > 100) return aviso('El porcentaje no puede pasar de 100%', 'error', true);
  ocupado(btn, true);
  try {
    const g = await API.guardarRubro(Object.assign({}, f, { valor, nombre: f.nombre.trim() }));
    const i = S.budget.rubros.findIndex(x => x.id === g.id);
    if (i >= 0) S.budget.rubros[i] = g; else S.budget.rubros.push(g);
    cerrarSheet();
    render();
    aviso(f.id ? 'Rubro actualizado' : 'Rubro añadido', 'pie_chart');
  } catch (e) { ocupado(btn, false); aviso(msgErr(e), 'error', true); }
}
async function eliminarRubroActual() {
  const f = S.rf;
  const ok = await confirmar('¿Eliminar rubro?', `Se quitará “${esc(f.nombre)}” de tu budget. Tus movimientos no se borran.`);
  if (!ok) return;
  try {
    await API.eliminarRubro(f.id);
    S.budget.rubros = S.budget.rubros.filter(x => x.id !== f.id);
    S.budget.apartados = S.budget.apartados.filter(a => a.rubroId !== f.id);
    cerrarSheet();
    render();
    aviso('Rubro eliminado', 'delete');
  } catch (e) { aviso(msgErr(e), 'error', true); }
}
async function alternarApartado(id) {
  const ym = S.month, B = S.budget;
  const ya = B.apartados.some(a => a.mes === ym && a.rubroId === id);
  B.apartados = ya ? B.apartados.filter(a => !(a.mes === ym && a.rubroId === id)) : B.apartados.concat({ mes: ym, rubroId: id });
  render();
  try {
    await API.marcarApartado(ym, id, !ya);
    if (!ya) aviso('Ahorro apartado este mes', 'savings');
  } catch (e) {
    B.apartados = ya ? B.apartados.concat({ mes: ym, rubroId: id }) : B.apartados.filter(a => !(a.mes === ym && a.rubroId === id));
    render();
    aviso(msgErr(e), 'error', true);
  }
}
function verMovimientosDe(label, cats) {
  if (!cats.length) return aviso('No hay gastos fuera de tus rubros este mes', 'info');
  S.filtroCat = { label, cats, cuenta: null };
  S.filtroTipo = 'Gasto';
  S.busqueda = '';
  go('movimientos');
}

// Misma estructura que Code.gs (ESTRUCTURA_SRI): se usa para la vista previa del botón "Organizar"
const ESTRUCTURA_UI = {
  renombrar: { 'Comida': 'Supermercado', 'Servicios': 'Servicios básicos' },
  nuevas: ['Supermercado', 'Restaurantes', 'Café', 'Mascotas', 'Arriendo', 'Cuota casa', 'Alícuota', 'Servicios básicos', 'Impuesto predial', 'Hogar',
    'Salud', 'Consultas médicas', 'Seguro médico', 'Educación', 'Útiles y libros', 'Arte y cultura', 'Ropa y calzado', 'Viajes', 'Hospedaje',
    'Transporte', 'Entretenimiento', 'Suscripciones', 'Compras', 'Otros gastos']
};
const CAT_ICONOS = ['shopping_basket', 'restaurant', 'coffee', 'pets', 'key', 'house', 'apartment', 'bolt', 'receipt_long', 'chair', 'local_pharmacy',
  'stethoscope', 'health_and_safety', 'school', 'menu_book', 'theater_comedy', 'checkroom', 'flight', 'hotel', 'directions_car', 'movie',
  'subscriptions', 'shopping_bag', 'category', 'fitness_center', 'child_care', 'local_gas_station', 'wifi', 'phone_iphone', 'savings', 'payments', 'celebration'];
const CAT_COLORES = ['#ff7a8f', '#fb923c', '#fbbf24', '#a3e635', '#2dd4bf', '#38bdf8', '#8ba3ff', '#818cf8', '#c084fc', '#f472b6', '#ff5b77', '#94a3b8'];
const usosCat = n => S.movs.filter(m => m.categoria === n).length;

function previaOrganizar() {
  const tengo = S.cats.map(c => c.nombre.toLowerCase());
  const ren = Object.keys(ESTRUCTURA_UI.renombrar).filter(v => tengo.includes(v.toLowerCase()) && !tengo.includes(ESTRUCTURA_UI.renombrar[v].toLowerCase()));
  const destinos = ren.map(v => ESTRUCTURA_UI.renombrar[v].toLowerCase());
  const nuevas = ESTRUCTURA_UI.nuevas.filter(n => !tengo.includes(n.toLowerCase()) && !destinos.includes(n.toLowerCase()));
  return { ren, nuevas };

/* =========================================================
   VISTA: Gastos personales SRI (estimación anual)
   Rebaja = 18 % × mínimo(gastos deducibles, canastas × valor de la canasta)
   ========================================================= */
function filaSRI(m) {
  if (m.tipo !== 'Gasto' || !hayGrupos()) return '';
  const k = conceptoDe(m.categoria);
  if (!esDeducible(k)) return `<div class="kv__row"><span>Gasto personal SRI</span><b><i class="sri sri--no">No deducible</i></b></div>`;
  const c = S.cats.find(x => x.nombre === m.categoria);
  return `<div class="kv__row"><span>Gasto personal SRI</span><b><i class="sri">${esc(CONCEPTO_INFO[k].titulo)}</i>
    <small class="kv__nota">${c && c.soloIntereses ? 'Solo intereses deducibles' : tieneFactura(m) ? 'Con factura' : 'Sin factura registrada'}</small></b></div>`;
}

function calcSRI(anio) {
  const movs = S.movs.filter(m => m.tipo === 'Gasto' && m.fecha.startsWith(String(anio)));
  const con = {};
  CONCEPTOS_SRI.forEach(k => { con[k] = { k, total: 0, n: 0, sinFactura: 0, montoSinFactura: 0, subs: {}, meses: Array(12).fill(0), cuota: 0 }; });
  let noDed = 0;
  movs.forEach(m => {
    const k = conceptoDe(m.categoria), c = S.cats.find(x => x.nombre === m.categoria);
    if (!esDeducible(k)) { noDed += Number(m.monto) || 0; return; }
    const x = con[k], v = Number(m.monto) || 0;
    if (c && c.soloIntereses) { x.cuota += v; return; }
    x.total += v; x.n++;
    x.subs[m.categoria] = (x.subs[m.categoria] || 0) + v;
    x.meses[Number(m.fecha.slice(5, 7)) - 1] += v;
    if (!tieneFactura(m)) { x.sinFactura++; x.montoSinFactura += v; }
  });
  const intereses = Number((S.sri.intereses || {})[anio]) || 0;
  const hayCuota = S.cats.some(c => c.soloIntereses);
  if (intereses) { con.Vivienda.total += intereses; con.Vivienda.subs['Intereses hipotecarios'] = intereses; }
  const deducible = CONCEPTOS_SRI.reduce((t, k) => t + con[k].total, 0);
  const canastas = S.sri.catastrofica ? 100 : CANASTAS[Math.min(5, Math.max(0, S.sri.cargas || 0))];
  const tope = canastas * (Number(S.sri.canasta) || 0);
  const base = Math.min(deducible, tope);
  return { con, noDed, deducible, canastas, tope, base, rebaja: base * 0.18, intereses, hayCuota,
    sinFactura: CONCEPTOS_SRI.reduce((t, k) => t + con[k].sinFactura, 0) };
}

function abrirConceptoSRI(k) {
  const r = calcSRI(S.sriAnio), x = r.con[k], info = CONCEPTO_INFO[k];
  const subs = Object.keys(x.subs).map(n => ({ n, v: x.subs[n] })).sort((a, b) => b.v - a.v);
  const max = Math.max(...x.meses, 1);
  abrirSheet(`<div class="sheet__head"><div><h3>${esc(info.titulo)} · ${S.sriAnio}</h3><p>${money(x.total)} deducibles${x.sinFactura ? ` · ${x.sinFactura} sin factura (${money(x.montoSinFactura)})` : ''}</p></div>

    <div class="stack sm">
      <h4 class="sri__h4">Por subcategoría</h4>

      <button class="btn btn--ghost" data-act="ir-categorias"><span class="ms">category</span>Ir a Categorías</button>

}

async function guardarSRI(cambios, texto) {
  const previo = Object.assign({}, S.sri, { intereses: Object.assign({}, S.sri.intereses) });
  if (cambios.cargas !== undefined) S.sri.cargas = cambios.cargas;
  if (cambios.catastrofica !== undefined) S.sri.catastrofica = cambios.catastrofica;
  if (cambios.canasta !== undefined) S.sri.canasta = cambios.canasta;
  if (cambios.intereses !== undefined) S.sri.intereses[cambios.anio] = cambios.intereses;
  render();
  try { S.sri = await API.guardarAjustesSRI(cambios); if (texto) aviso(texto); }
  catch (e) { S.sri = previo; render(); aviso(msgErr(e), 'error', true); }
}

function vMovimientos() {
  const nRev = porRevisar().length;
  if (S.filtroTipo === 'revisar' && !nRev) S.filtroTipo = 'todos';
  const chips = [['todos', 'Todos'], ['Gasto', 'Gastos'], ['Ingreso', 'Ingresos']].concat(nRev ? [['revisar', `Por revisar · ${nRev}`]] : [])
    .map(([v, t]) => `<button class="chip ${S.filtroTipo === v ? 'on' + (v === 'revisar' ? ' coral' : '') : ''}" data-act="filtro-tipo" data-v="${v}">${v === 'revisar' ? '<span class="ms">document_scanner</span>' : ''}${t}</button>`).join('');
  return `<div class="stack">
    <div class="fade-up">${selectorMes()}</div>
    <div class="search fade-up d1"><span class="ms">search</span>
      <input id="buscar" class="input" type="search" placeholder="Buscar movimiento" value="${esc(S.busqueda)}" autocomplete="off"></div>
    <div class="chips fade-up d1">${chips}</div>
    ${S.filtroCat ? `<div class="fcat fade-up d1"><span class="ms">filter_alt</span><span>Categoría: <b>${esc(S.filtroCat.label)}</b>${S.filtroCat.cuenta ? ' · ' + esc(cuentaLabel(S.filtroCat.cuenta)) : ''}</span>
      <button class="iconbtn sm" data-act="quitar-cat" aria-label="Quitar filtro de categoría"><span class="ms">close</span></button></div>` : ''}
    <div id="mov-list" class="stack fade-up d2">${listaMovimientos()}</div>
  </div>`;
}

function listaMovimientos() {
  const q = S.busqueda.trim().toLowerCase();
  let lista = S.filtroTipo === 'revisar' ? porRevisar() : delMes();
  if (S.filtroTipo === 'Gasto' || S.filtroTipo === 'Ingreso') lista = lista.filter(m => m.tipo === S.filtroTipo);
  if (S.filtroCat) {
    const fc = S.filtroCat;
    lista = lista.filter(m => fc.cats.includes(m.categoria || 'Sin categoría') && (!fc.cuenta || m.cuenta === fc.cuenta));
  }
  if (q) lista = lista.filter(m => [m.alias, m.comercio, m.nombreImpreso, m.razonSocial, m.categoria, cuentaLabel(m.cuenta), m.descripcion, m.ubicacion, money(m.monto), esCodigo(m.id) ? m.id : '']
    .join(' ').toLowerCase().includes(q));
  if (!lista.length) {
    return q ? vacio('search_off', 'Sin resultados', `No encontramos movimientos con “${esc(S.busqueda)}”.`)
             : S.filtroCat ? vacio('filter_alt_off', 'Sin movimientos en esta categoría', 'Cambia de mes o quita el filtro.')
             : vacio('receipt_long', 'Sin movimientos este mes', 'Toca el botón + para registrar uno.');
  }
  const grupos = [];
  lista.forEach(m => {
    const g = grupos[grupos.length - 1];
    if (g && g.fecha === m.fecha) g.items.push(m); else grupos.push({ fecha: m.fecha, items: [m] });
  });
  return grupos.map(g => {
    const { ing, gas } = totales(g.items), neto = ing - gas;
    return `<section class="group">
      <div class="day-head"><span class="day-head__l"><i class="${g.fecha === hoyStr() ? 'hoy' : ''}"></i>${etiquetaDia(g.fecha)}</span>
        <span class="day-head__t num ${neto > 0 ? 'c-green' : ''}">${neto > 0 ? '+' : '-'}${money(neto)}</span></div>
      <div class="group-card">${g.items.map(m => txRow(m, 'lista')).join('')}</div>
    </section>`;
  }).join('');
}

   Los "momentos" son fotos de un movimiento y se ven como historias.

function idsArchivo() {
  const lista = delMes();
  return idsHistorias(S.archivoTab === 'favoritos' ? lista.filter(m => m.favorito) : lista);
}

function vArchivo() {
  const lista = delMes();
  const tabs = [['momentos', 'auto_stories', 'Historias'], ['favoritos', 'favorite', 'Favoritos'], ['calendario', 'calendar_month', 'Calendario']]
    .map(([k, i, t]) => `<button class="atab ${S.archivoTab === k ? 'on' : ''}" data-act="archivo-tab" data-v="${k}">
      <span class="atab__ic"><span class="ms ${S.archivoTab === k && k === 'favoritos' ? 'fill' : ''}">${i}</span></span><span>${t}</span><i></i></button>`).join('');

  let stats, cuerpo;
  if (S.archivoTab === 'calendario') {
    const { gas } = totales(lista);
    stats = `<b>${lista.length}</b> mov. · <b class="num">-${money(gas)}</b>`;
    cuerpo = calendario(lista);
  } else {
    const favs = S.archivoTab === 'favoritos';
    const base = favs ? lista.filter(m => m.favorito) : lista;
    const ids = idsHistorias(base);
    const nFotos = ids.reduce((s, id) => s + momentosDe(id).length, 0);
    const sinFotos = favs ? base.filter(m => !momentosDe(m.id).length) : [];
    stats = `<b>${ids.length}</b> ${ids.length === 1 ? 'historia' : 'historias'} · <b>${nFotos}</b> ${nFotos === 1 ? 'foto' : 'fotos'}`;
    if (ids.length || sinFotos.length) {
      cuerpo = (ids.length ? barraHistorias(ids, !favs) + '<div class="sec-t fade-up d2">Todas las fotos</div>' + gridMomentos(ids) : '') +
        (sinFotos.length ? `<div class="sec-t">Favoritos sin fotos</div><div class="pgrid">${sinFotos.map(tileSinFoto).join('')}</div>` : '');
    } else if (favs) {
      cuerpo = vacio('favorite', 'No tienes favoritos', 'Toca el corazón en cualquier movimiento para guardarlo en tus momentos destacados.');
    } else {
      cuerpo = barraHistorias([], true) + vacio('auto_stories', 'Aún no hay momentos este mes',
        'Elige fotos del lugar, de lo que pediste o de quién te acompañó y te sugiero a qué movimiento pertenecen.',
        '<button class="btn btn--primary btn--auto" data-act="mom-flujo"><span class="ms">add_a_photo</span>Añadir momento</button>');
    }
  }
  return `<div class="stack">
    <div class="atabs fade-up">${tabs}</div>
    <div class="ribbon fade-up d1">${selectorMes(true)}<span class="ribbon__s">${stats}</span></div>
    ${cuerpo}
  </div>`;
}

function barraHistorias(ids, conAgregar) {

      <span class="sbub__ring"><span class="sbub__img"><span class="ms">add</span></span></span>
      <span class="sbub__name">Tu momento</span></button>` : '';

}

function gridMomentos(ids) {
  let k = 0;
  return `<div class="pgrid">${ids.map(id => {
    const m = porId(id), d = toDate(m.fecha);
    return momentosDe(id).map((mo, j) => `<div class="ptile fade-up" style="animation-delay:${Math.min(k++, 15) * 30}ms" role="button" tabindex="0" data-act="st-abrir" data-id="${esc(id)}" data-j="${j}">

function tileSinFoto(m) {

  </div>`;

function calendario(lista) {
  const [y, m] = S.month.split('-').map(Number);
  const offset = (new Date(y, m - 1, 1).getDay() + 6) % 7;   // semana empieza en lunes
  const dias = new Date(y, m, 0).getDate();
  const hoy = hoyStr();
  const porDia = {};
  lista.forEach(x => { (porDia[x.fecha] = porDia[x.fecha] || []).push(x); });
  const { gas } = totales(lista);

  let celdas = '';
  for (let i = 0; i < offset; i++) celdas += '<div></div>';
  for (let d = 1; d <= dias; d++) {
    const f = `${y}-${pad(m)}-${pad(d)}`, arr = porDia[f] || [];
    if (arr.length) {
      const portada = arr.map(x => momentosDe(x.id)[0]).find(Boolean);
      celdas += `<button class="cal__d has ${f === hoy ? 'hoy' : ''} ${arr.length >= 3 ? 'big' : ''}" data-act="dia" data-f="${f}">
        ${portada ? `<i class="bg" data-foto="${esc(portada.fotoId)}"></i>` : ''}<span>${d}</span><em class="cal__n">+${arr.length}</em></button>`;
    } else {
      celdas += `<div class="cal__d ${f === hoy ? 'hoy' : ''}"><span>${d}</span></div>`;
    }
  }
  return `<section class="panel fade-up d2">
    <div class="cal__head"><h2>${MESES[m - 1]} ${y}</h2>
      <span class="ribbon__s"><b>${lista.length}</b> mov. · <b class="num c-coral">-${money(gas)}</b></span></div>
    <div class="cal__dow">${['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'].map(x => `<span>${x}</span>`).join('')}</div>
    <div class="cal__grid">${celdas}</div>
  </section>`;
}

function abrirDia(f) {
  const lista = S.movs.filter(m => m.fecha === f).sort(orden);
  const { ing, gas } = totales(lista);
  const conHistoria = idsHistorias(lista).length;
  const items = lista.map(m => {
    const c = cat(m.categoria), portada = momentosDe(m.id)[0];
    const th = portada
      ? `<span class="dthumb" data-foto="${esc(portada.fotoId)}"></span>`
      : `<span class="dthumb" style="background-color:${hexA(c.color, .15)};color:${esc(c.color)}"><span class="ms">${esc(c.icono)}</span></span>`;
    return `<button class="ditem" data-act="ver" data-id="${esc(m.id)}">${th}
      <span class="tx__main"><span class="tx__name"><span>${esc(nombreDe(m))}</span></span><span class="tx__sub">${esc(m.hora)} · ${esc(m.categoria)}</span></span>
      <span class="tx__amt num ${m.tipo === 'Ingreso' ? 'c-green' : 'c-coral'}">${signo(m)}</span></button>`;

  abrirSheet(`<div class="sheet__head"><div><h3>${cap(fechaLarga(f))}</h3><p>${plural(lista.length, 'movimiento registrado', 'movimientos registrados')}</p></div>

    ${conHistoria ? `<button class="btn btn--primary" style="margin-bottom:12px" data-act="st-dia" data-f="${f}"><span class="ms">play_circle</span>Ver historias del día</button>` : ''}

  pintarFotos($('#sheet-body'));

/**
 * Sube fotos como momentos de un movimiento, una por una.
 * items: File o data URL. alAvanzar(hechas, total) se llama tras cada foto.
 * Devuelve { ok, fallos, omitidas }.
 */
const SUBIDAS = {};   // movId → fotos que faltan por subir (para los indicadores)
async function subirMomentos(movId, items, alAvanzar) {
  const libres = MAX_MOM - momentosDe(movId).length - (SUBIDAS[movId] || 0);
  const lista = items.slice(0, Math.max(0, libres));
  const omitidas = items.length - lista.length;
  SUBIDAS[movId] = (SUBIDAS[movId] || 0) + lista.length;
  let ok = 0, fallos = 0;
  for (let k = 0; k < lista.length; k++) {
    try {
      const it = lista[k];
      const data = typeof it === 'string' ? it : await comprimirImagen(it);
      const mo = await API.agregarMomento(movId, data);
      FOTOS[mo.fotoId] = data;
      S.momentos.push(mo);
      ok++;
    } catch (e) { fallos++; }
    SUBIDAS[movId]--;
    if (alAvanzar) try { alAvanzar(k + 1, lista.length); } catch (e) { /* la vista cambió */ }
  }
  if (!SUBIDAS[movId]) delete SUBIDAS[movId];
  return { ok, fallos, omitidas };
}
function avisoSubida(movId, r) {
  const m = porId(movId), nombre = m ? nombreDe(m) : '';
  if (r.fallos) aviso(`${plural(r.fallos, 'foto no se pudo', 'fotos no se pudieron')} subir`, 'error', true);
  else if (r.ok) aviso(`${plural(r.ok, 'momento añadido', 'momentos añadidos')}${nombre ? ' a ' + nombre : ''}${r.omitidas ? ` · ${r.omitidas} no cupieron` : ''}`, 'auto_stories', false,
    { label: 'Ver', act: 'st-mov', id: movId });
  else if (r.omitidas) aviso(`Máximo ${MAX_MOM} fotos por movimiento`, 'info', true);
}

async function agregarMomentosDetalle(archivos) {
  const movId = S.detalleId;
  const libres = MAX_MOM - momentosDe(movId).length - (S.subiendoMov === movId ? S.subiendo : 0);
  if (libres <= 0) return aviso(`Máximo ${MAX_MOM} fotos por movimiento`, 'info', true);
  const n = Math.min(libres, archivos.length);
  S.subiendoMov = movId;
  S.subiendo += n;
  refrescarStripDetalle(movId);
  const r = await subirMomentos(movId, archivos, () => { S.subiendo = Math.max(0, S.subiendo - 1); refrescarStripDetalle(movId); });
  if (!S.subiendo) S.subiendoMov = null;
  if (S.view === 'detalle' && S.detalleId === movId) render();
  avisoSubida(movId, r);
}

/** Momento rápido desde la lista: sube y muestra el avance en el aviso. */
async function momentoRapido(movId, archivos) {
  const total = Math.min(archivos.length, MAX_MOM - momentosDe(movId).length - (SUBIDAS[movId] || 0));
  if (total <= 0) return aviso(`Máximo ${MAX_MOM} fotos por movimiento`, 'info', true);
  const refrescar = () => { if (S.view === 'movimientos') { const el = $('#mov-list'); if (el) { el.innerHTML = listaMovimientos(); pintarFotos(el); } } };
  aviso(`Subiendo 1 de ${total}…`, 'cloud_upload', false, null, true);
  const pend = subirMomentos(movId, archivos, (k, n) => { if (k < n) aviso(`Subiendo ${k + 1} de ${n}…`, 'cloud_upload', false, null, true); });
  refrescar();
  const r = await pend;
  refrescar();
  avisoSubida(movId, r);
}

/** Comprobante directo desde el detalle (sin pasar por Editar). */
async function adjuntarComprobanteDetalle(archivo) {
  const id = S.detalleId, m = porId(id);
  if (!m) return;
  S.subiendoComp = id;
  render();
  try {
    const data = await comprimirImagen(archivo);
    const r = await API.adjuntarComprobante(id, data);
    FOTOS[r.fotoId] = data;
    const x = porId(id);
    if (x) x.fotoId = r.fotoId;
    aviso('Comprobante guardado', 'receipt_long');
  } catch (e) { aviso(msgErr(e), 'error', true); }
  S.subiendoComp = null;
  if (S.view === 'detalle' && S.detalleId === id) render();
}

async function guardarFormulario(btn) {
  const f = S.form;
  const monto = parseFloat(String(f.montoTxt).replace(/[^\d.,]/g, '').replace(',', '.'));
  if (!(monto > 0)) return aviso('Escribe un monto válido', 'error', true);
  if (!String(f.comercio).trim()) return aviso(f.tipo === 'Ingreso' ? 'Escribe el origen del ingreso' : 'Escribe el comercio', 'error', true);
  if (!f.categoria) return aviso('Elige una categoría', 'error', true);
  if (!f.cuenta) return aviso('Elige una cuenta', 'error', true);
  if (!f.fecha) return aviso('Elige una fecha', 'error', true);

  const datos = {
    id: f.id, tipo: f.tipo, monto, comercio: f.comercio.trim(), alias: f.tipo === 'Ingreso' ? '' : String(f.alias || '').trim(), categoria: f.categoria, cuenta: f.cuenta,
    fecha: f.fecha, hora: f.hora || '', descripcion: (f.descripcion || '').trim(), ubicacion: (f.ubicacion || '').trim(),
    favorito: !!f.favorito, fotoData: f.fotoData || null, quitarFoto: !!f.quitarFoto
  };
  ocupado(btn, true, f.fotoData ? 'Subiendo foto…' : 'Guardando…');
  try {
    const guardado = await API.guardarMovimiento(datos);
    if (f.fotoData && guardado.fotoId) FOTOS[guardado.fotoId] = f.fotoData;
    S.movs = S.movs.filter(m => m.id !== guardado.id).concat(guardado);
    if (guardado.ruc && guardado.alias !== undefined) {
      S.movs.filter(x => x.estado === 'Por revisar' && x.ruc === guardado.ruc).forEach(x => { x.alias = guardado.alias; });
    }
    S.month = guardado.fecha.slice(0, 7);
    for (const idm of f.momentosBorrar) {
      try { await API.eliminarMomento(idm); S.momentos = S.momentos.filter(x => x.id !== idm); } catch (e) { /* se reintenta otro día */ }
    }
    let fallos = 0;
    for (let k = 0; k < f.momentosNuevos.length; k++) {
      btn.innerHTML = `<span class="spin"></span>Subiendo momento ${k + 1} de ${f.momentosNuevos.length}…`;
      try {
        const mo = await API.agregarMomento(guardado.id, f.momentosNuevos[k]);
        FOTOS[mo.fotoId] = f.momentosNuevos[k];
        S.momentos.push(mo);
      } catch (e) { fallos++; }
    }
    if (fallos) aviso(`Guardado, pero ${plural(fallos, 'foto no se pudo', 'fotos no se pudieron')} subir`, 'error', true);
    else aviso(f.id ? 'Movimiento actualizado' : 'Movimiento guardado');
    S.form = null;
    if (!f.id) { S.detalleId = guardado.id; S.view = 'detalle'; render(); window.scrollTo(0, 0); }
    else back();
  } catch (e) {
    ocupado(btn, false);
    aviso(msgErr(e), 'error', true);
  }
}

/** Reduce la foto antes de subirla (máx. 1600 px, JPEG). */
function comprimirImagen(archivo, max = 1600, calidad = 0.82) {
  return new Promise((ok, falla) => {
    const url = URL.createObjectURL(archivo);
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', calidad));
    };
    img.onerror = () => { URL.revokeObjectURL(url); falla(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}

/** Logo en PNG (conserva la transparencia), máximo 320 px. */
function comprimirLogo(archivo) {
  return new Promise((ok, falla) => {
    const url = URL.createObjectURL(archivo), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 320 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); falla(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}

/* Zoom del comprobante: pellizcar, doble toque y rueda del mouse */
const VZ = { s: 1, x: 0, y: 0, ptrs: new Map(), pinch: null, pan: null, movido: false, ultimoTap: 0 };
const MAX_ZOOM = 5;
function aplicarZoom(animar) {
  const img = $('#viewer-img');
  const w = img.offsetWidth, h = img.offsetHeight;
  if (VZ.s <= 1.001) { VZ.s = 1; VZ.x = 0; VZ.y = 0; }
  const mx = w * (VZ.s - 1) / 2, my = h * (VZ.s - 1) / 2;
  VZ.x = Math.max(-mx, Math.min(mx, VZ.x));
  VZ.y = Math.max(-my, Math.min(my, VZ.y));
  img.style.transition = animar ? 'transform .25s cubic-bezier(.16,1,.3,1)' : 'none';
  img.style.transform = `translate(${VZ.x}px, ${VZ.y}px) scale(${VZ.s})`;
  $('#ov-viewer').classList.toggle('zoom', VZ.s > 1);
}
function resetZoom() {
  Object.assign(VZ, { s: 1, x: 0, y: 0, pinch: null, pan: null, movido: false, ultimoTap: 0 });
  VZ.ptrs.clear();
  aplicarZoom(false);
}
/** Punto de la pantalla relativo al centro de la imagen sin transformar. */
function puntoImg(cx, cy) {
  const r = $('#viewer-img').getBoundingClientRect();
  return { x: cx - (r.left + r.width / 2 - VZ.x), y: cy - (r.top + r.height / 2 - VZ.y) };
}
function zoomEn(s2, cx, cy, animar) {
  s2 = Math.max(1, Math.min(MAX_ZOOM, s2));
  const f = puntoImg(cx, cy);
  VZ.x = f.x - (f.x - VZ.x) * s2 / VZ.s;
  VZ.y = f.y - (f.y - VZ.y) * s2 / VZ.s;
  VZ.s = s2;
  aplicarZoom(animar);
}
(function gestosVisor() {
  const ov = $('#ov-viewer');
  const dist = () => { const [a, b] = Array.from(VZ.ptrs.values()); return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
  const medio = () => { const [a, b] = Array.from(VZ.ptrs.values()); return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
  const iniciarPan = () => { const [p] = Array.from(VZ.ptrs.values()); VZ.pan = p ? { x0: p.x, y0: p.y, x: VZ.x, y: VZ.y } : null; };
  ov.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || !$('#viewer-img').getAttribute('src')) return;
    VZ.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (VZ.ptrs.size === 1) { VZ.movido = false; iniciarPan(); }
    if (VZ.ptrs.size === 2) {
      const m = medio();
      VZ.pinch = { d: dist(), s: VZ.s, x: VZ.x, y: VZ.y, m, f: puntoImg(m.x, m.y) };
      VZ.pan = null; VZ.movido = true;
    }
  });
  ov.addEventListener('pointermove', e => {
    if (!VZ.ptrs.has(e.pointerId)) return;
    VZ.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (VZ.pinch && VZ.ptrs.size >= 2) {
      const p = VZ.pinch, m = medio();
      const s2 = Math.max(.8, Math.min(MAX_ZOOM, p.s * dist() / p.d));
      VZ.x = p.f.x - (p.f.x - p.x) * s2 / p.s + (m.x - p.m.x);
      VZ.y = p.f.y - (p.f.y - p.y) * s2 / p.s + (m.y - p.m.y);
      VZ.s = s2;
      const img = $('#viewer-img');
      img.style.transition = 'none';
      img.style.transform = `translate(${VZ.x}px, ${VZ.y}px) scale(${VZ.s})`;
    } else if (VZ.pan) {
      const dx = e.clientX - VZ.pan.x0, dy = e.clientY - VZ.pan.y0;
      if (Math.abs(dx) + Math.abs(dy) > 8) VZ.movido = true;
      if (VZ.s > 1) { VZ.x = VZ.pan.x + dx; VZ.y = VZ.pan.y + dy; aplicarZoom(false); }
    }
  });
  const soltar = e => {
    if (!VZ.ptrs.has(e.pointerId)) return;
    VZ.ptrs.delete(e.pointerId);
    if (VZ.ptrs.size < 2 && VZ.pinch) { VZ.pinch = null; aplicarZoom(true); iniciarPan(); return; }
    if (VZ.ptrs.size) return;
    VZ.pan = null;
    if (e.type !== 'pointerup' || VZ.movido) return;
    const ahora = Date.now();
    if (ahora - VZ.ultimoTap < 320) {
      VZ.ultimoTap = 0;
      if (VZ.s > 1) { VZ.s = 1; aplicarZoom(true); } else zoomEn(2.5, e.clientX, e.clientY, true);
    } else VZ.ultimoTap = ahora;
  };
  ov.addEventListener('pointerup', soltar);
  ov.addEventListener('pointercancel', soltar);
  ov.addEventListener('wheel', e => {
    if (!ov.classList.contains('open')) return;
    e.preventDefault();
    zoomEn(VZ.s * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY, false);
  }, { passive: false });
  ['gesturestart', 'gesturechange'].forEach(t => ov.addEventListener(t, e => e.preventDefault()));
})();

/** Hora en que se tomó la foto: EXIF (DateTimeOriginal) o, si no hay, la fecha del archivo. */
async function fechaFoto(file) {
  try {
    const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (v.getUint16(0) === 0xFFD8) {
      let o = 2;
      while (o + 10 < v.byteLength) {
        const marca = v.getUint16(o), largo = v.getUint16(o + 2);
        if (marca === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
          const t = o + 10, le = v.getUint16(t) === 0x4949;
          const u16 = x => v.getUint16(x, le), u32 = x => v.getUint32(x, le);
          const ifd = (pos, tags) => {
            const out = {}, n = u16(t + pos);
            for (let k = 0; k < n; k++) {
              const e = t + pos + 2 + k * 12;
              if (e + 12 > v.byteLength) break;
              const tag = u16(e);
              if (tags.includes(tag)) out[tag] = { n: u32(e + 4), val: u32(e + 8), pos: e + 8 };
            }
            return out;
          };
          const texto = en => {
            if (!en) return '';
            const ini = en.n > 4 ? t + en.val : en.pos;
            let r = '';
            for (let k = 0; k < en.n - 1 && ini + k < v.byteLength; k++) r += String.fromCharCode(v.getUint8(ini + k));
            return r;
          };
          const cero = ifd(u32(t + 4), [0x0132, 0x8769]);
          let txt = '';
          if (cero[0x8769]) { const ex = ifd(cero[0x8769].val, [0x9003, 0x9004]); txt = texto(ex[0x9003]) || texto(ex[0x9004]); }
          txt = txt || texto(cero[0x0132]);
          const m = txt.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/);
          if (m) return { ts: new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime(), fiable: true };
          break;
        }
        if ((marca & 0xFF00) !== 0xFF00 || marca === 0xFFDA) break;
        o += 2 + largo;
      }
    }
  } catch (e) { /* sin EXIF */ }
  const ts = file.lastModified || 0;
  // En iPhone, las fotos elegidas de la galería suelen llegar con la hora de "ahora"
  return { ts, fiable: !!ts && Math.abs(Date.now() - ts) > 3 * 60000 };
}

const horaMov = m => { const d = toDate(m.fecha); const [h, mi] = String(m.hora || '12:00').split(':').map(Number); d.setHours(h || 0, mi || 0, 0, 0); return d.getTime(); };
function distanciaTxt(dif) {
  const min = Math.round(dif / 60000);
  if (min < 60) return min <= 1 ? 'a la misma hora' : `a ${min} min de tus fotos`;
  const h = Math.round(min / 60);
  if (h < 36) return `a ${plural(h, 'hora', 'horas')} de tus fotos`;
  return `a ${plural(Math.round(h / 24), 'día', 'días')} de tus fotos`;
}

async function iniciarFlujoMomento(archivos) {
  if (archivos.length > MAX_MOM) aviso(`Se usarán las primeras ${MAX_MOM} fotos`, 'info', true);
  const lista = archivos.slice(0, MAX_MOM);
  abrirSheet(`<div class="sheet__head"><div><h3>Añadir momento</h3><p>Preparando ${plural(lista.length, 'foto', 'fotos')}…</p></div></div>
    <div class="mfcarga"><span class="spin"></span></div>`);
  const fotos = [];
  for (const a of lista) {
    try {
      const [data, info] = await Promise.all([comprimirImagen(a), fechaFoto(a)]);
      fotos.push({ data, ts: info.fiable ? info.ts : 0 });
    } catch (e) { /* imagen ilegible */ }
  }
  if (!$('#ov-sheet').classList.contains('open')) return;   // cerró la hoja mientras tanto
  if (!fotos.length) { cerrarSheet(); return aviso('No se pudieron leer las fotos', 'error', true); }
  if (S.mf && S.mf.fotos) {   // "Añadir más" dentro del flujo
    S.mf.fotos = S.mf.fotos.concat(fotos).slice(0, MAX_MOM);
  } else {
    S.mf = { fotos, q: '', destino: null };
  }
  calcularSugerencia();
  refrescarMF();
}

function calcularSugerencia() {
  const f = S.mf;
  const tss = f.fotos.map(x => x.ts).filter(Boolean).sort((a, b) => a - b);
  f.ts = tss.length ? tss[Math.floor(tss.length / 2)] : 0;
  const cands = S.movs.filter(m => m.tipo === 'Gasto' || momentosDe(m.id).length)
    .map(m => ({ m, dif: f.ts ? Math.abs(horaMov(m) - f.ts) : 0 }))
    .sort((a, b) => f.ts ? a.dif - b.dif : orden(a.m, b.m));
  f.cands = cands;
  const top = cands[0];
  f.sugerido = top && f.ts && top.dif < 36 * 3600000 ? top.m.id : null;
  if (!f.destino || !porId(f.destino)) f.destino = f.sugerido;
}

function opcionMF(m, dif) {
  const f = S.mf, c = cat(m.categoria), on = f.destino === m.id, sug = f.sugerido === m.id;
  const llenos = momentosDe(m.id).length >= MAX_MOM;
  const sub = [cuandoCorto(m), money(m.monto), f.ts && dif != null && !f.q ? distanciaTxt(dif) : ''].filter(Boolean).join(' · ');
  return `<button class="mfop ${on ? 'on' : ''}" data-act="mf-dest" data-id="${esc(m.id)}" ${llenos ? 'disabled' : ''}>
      ${icCat(c, momentosDe(m.id).length ? 'tx__ic tx__ic--story' : '')}
      <span class="tx__main"><span class="tx__name"><span>${esc(nombreDe(m))}</span>${sug ? '<i class="mfop__sug">Sugerido</i>' : ''}</span>
        <span class="tx__sub">${llenos ? 'Ya tiene el máximo de fotos' : esc(sub)}</span></span>
      <span class="ms fill mfop__ok">check_circle</span></button>`;
}

function listaMF() {
  const f = S.mf, q = f.q.trim().toLowerCase();
  let filas;
  if (q) {
    filas = S.movs.filter(m => [m.alias, m.comercio, m.categoria, m.descripcion, money(m.monto)].join(' ').toLowerCase().includes(q))
      .sort(orden).slice(0, 12).map(m => ({ m, dif: null }));
    if (!filas.length) return `<p class="hint sm mfvacio">No hay movimientos con “${esc(f.q)}”.</p>`;
  } else {
    filas = f.cands.slice(0, 6);
    const sel = f.destino && !filas.some(x => x.m.id === f.destino) && f.cands.find(x => x.m.id === f.destino);
    if (sel) filas = [sel].concat(filas.slice(0, 5));
    if (!filas.length) return '<p class="hint sm mfvacio">Aún no tienes movimientos. Crea uno con estas fotos.</p>';
  }
  return filas.map(x => opcionMF(x.m, x.dif)).join('');
}

function htmlMomentoFlujo() {
  const f = S.mf;
  const destino = f.destino && porId(f.destino);
  const d = f.ts ? new Date(f.ts) : null;
  const cuando = d ? `tomadas el ${d.getDate()} ${MES_C[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}` : 'sin hora de captura';
  const libres = destino ? MAX_MOM - momentosDe(destino.id).length : MAX_MOM;
  const n = Math.min(f.fotos.length, libres);
  const bandeja = f.fotos.map((x, k) => `<span class="mthumb" style="background-image:url('${x.data}')">
      ${f.subiendo ? '' : `<button class="mthumb__x" data-act="mf-quitar" data-v="${k}" aria-label="Quitar"><span class="ms">close</span></button>`}</span>`).join('') +
    (!f.subiendo && f.fotos.length < MAX_MOM ? '<button class="mthumb mthumb--add" data-act="mf-mas"><span class="ms">add_a_photo</span><small>Más</small></button>' : '');
  const pie = f.subiendo
    ? `<div class="mfprog"><i style="width:${Math.round((f.hechas || 0) / f.total * 100)}%"></i></div>
       <p class="mfprog__t">Subiendo ${Math.min(f.total, (f.hechas || 0) + 1)} de ${f.total} a ${esc(nombreDe(destino))}…</p>`
    : `<button class="btn btn--primary" data-act="mf-subir" ${destino && n > 0 ? '' : 'disabled'}><span class="ms">auto_stories</span>${
        destino ? `Añadir ${plural(n, 'foto', 'fotos')} a ${esc(nombreDe(destino))}` : 'Elige un movimiento'}</button>
       ${destino && n < f.fotos.length ? `<p class="ap__falta">Ese movimiento solo admite ${plural(Math.max(0, libres), 'foto más', 'fotos más')}.</p>` : ''}
       <button class="btn btn--ghost" data-act="mf-nuevo"><span class="ms">add</span>Crear un movimiento nuevo con estas fotos</button>`;
  return `<div class="sheet__head"><div><h3>Añadir momento</h3><p>${plural(f.fotos.length, 'foto', 'fotos')} · ${cuando}</p></div>
      <button class="iconbtn sm" data-act="cerrar" aria-label="Cerrar"><span class="ms">close</span></button></div>
    <div class="ap">
      <div class="mstrip">${bandeja}</div>
      <section class="ap__sec"><h4>¿De qué movimiento?</h4>
        ${f.subiendo ? '' : `<div class="search"><span class="ms">search</span><input id="mf-buscar" class="input" type="search" placeholder="Buscar otro movimiento" value="${esc(f.q)}" autocomplete="off"></div>`}
        <div class="mflista" id="mf-lista">${f.subiendo ? (destino ? opcionMF(destino, null) : '') : listaMF()}</div>
      </section>
      <div class="actions">${pie}</div>
    </div>`;
}

function refrescarMF() {
  if (!S.mf || !S.mf.fotos) return;
  const body = $('#sheet-body'), hoja = body.parentElement, y = hoja.scrollTop;
  body.innerHTML = htmlMomentoFlujo();
  pintarFotos(body);
  hoja.scrollTop = y;
}

async function subirFlujoMomento() {
  const f = S.mf, movId = f && f.destino;
  if (!movId || f.subiendo) return;
  const datos = f.fotos.map(x => x.data);
  Object.assign(f, { subiendo: true, hechas: 0, total: Math.min(datos.length, MAX_MOM - momentosDe(movId).length) });
  refrescarMF();
  const r = await subirMomentos(movId, datos, k => { if (S.mf === f) { f.hechas = k; refrescarMF(); } });
  if (S.mf === f) cerrarSheet();
  render();
  avisoSubida(movId, r);
}

function nuevoConFotosMF() {
  const f = S.mf;
  if (!f) return;
  cerrarSheet();
  abrirFormulario(null);
  S.form.momentosNuevos = f.fotos.map(x => x.data);
  if (f.ts) { const d = new Date(f.ts); S.form.fecha = fechaStr(d); S.form.hora = `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  render();
}

/* Eliminar: hoja que muestra todo lo que se borrará. El movimiento desaparece
   al instante y queda 5 s para Deshacer; luego se borra de verdad en el servidor. */
const BORRADOS = new Map();   // id → { mov, momentos, detalles, t }
const ESPERA_BORRADO = 5000;

function eliminarActual() {
  const m = porId(S.detalleId);
  if (!m) return;
  const nMom = momentosDe(m.id).length, nDet = detallesDe(m.id).length;
  const fila = (ic, t, sub) => `<div class="delit"><span class="delit__ic"><span class="ms">${ic}</span></span>
      <span class="tx__main"><b>${t}</b><span>${sub}</span></span></div>`;
  abrirSheet(`<div class="sheet__head"><div><h3>¿Eliminar este movimiento?</h3><p>Esto es lo que se borrará</p></div>
      <button class="iconbtn sm" data-act="cerrar" aria-label="Cerrar"><span class="ms">close</span></button></div>
    <div class="dellist">
      ${fila('receipt_long', esc(nombreDe(m)), `${signo(m)} · ${esc(cuandoCorto(m))} · ${esc(m.categoria)}`)}
      ${m.fotoId ? fila('image', 'El comprobante', 'La foto se borra de tu Drive') : ''}
      ${nMom ? fila('auto_stories', plural(nMom, 'momento', 'momentos'), 'Las fotos se borran de tu Drive') : ''}
      ${nDet ? fila('list_alt', plural(nDet, 'producto', 'productos') + ' de la factura', 'El detalle leído por el Escáner') : ''}
    </div>
    <p class="delnote"><span class="ms">undo</span>Tendrás 5 segundos para deshacer.</p>
    <div class="actions">
      <button class="btn btn--danger-solid" data-act="del-confirmar" data-id="${esc(m.id)}"><span class="ms">delete</span>Eliminar</button>
      <button class="btn btn--ghost" data-act="cerrar">Cancelar</button>
    </div>`);
}

function borrarConDeshacer(id) {
  const m = porId(id);
  if (!m) return;
  cerrarSheet();
  const copia = { mov: m, momentos: S.momentos.filter(x => x.movId === id), detalles: S.detalles.filter(x => x.movId === id) };
  S.movs = S.movs.filter(x => x.id !== id);
  S.momentos = S.momentos.filter(x => x.movId !== id);
  S.detalles = S.detalles.filter(x => x.movId !== id);
  copia.t = setTimeout(() => ejecutarBorrado(id), ESPERA_BORRADO);
  BORRADOS.set(id, copia);
  if (S.view === 'detalle' && S.detalleId === id) { S.stack = S.stack.filter(v => VISTAS[v].main); back(); }
  else render();
  aviso('Movimiento eliminado', 'delete', false, { label: 'Deshacer', act: 'deshacer', id }, false, ESPERA_BORRADO);
}

function restaurarBorrado(c) {
  if (!porId(c.mov.id)) S.movs.push(c.mov);
  S.momentos = S.momentos.concat(c.momentos);
  S.detalles = S.detalles.concat(c.detalles);
}

function deshacerBorrado(id) {
  const c = BORRADOS.get(id);
  if (!c) return;
  clearTimeout(c.t);
  BORRADOS.delete(id);
  restaurarBorrado(c);
  S.detalleId = id;
  go('detalle');
  aviso('Movimiento restaurado', 'undo');
}

async function ejecutarBorrado(id) {
  const c = BORRADOS.get(id);
  if (!c) return;
  clearTimeout(c.t);
  BORRADOS.delete(id);
  if ($(`#toast [data-act="deshacer"][data-id="${CSS.escape(id)}"]`)) ocultarAviso();
  try {
    await API.eliminarMovimiento(id);
  } catch (e) {
    if (/ya no existe/i.test(msgErr(e))) return;
    restaurarBorrado(c);
    render();
    aviso('No se pudo eliminar: ' + msgErr(e), 'error', true);
  }
}
// Si sales de la app o cambias de pestaña, lo pendiente se borra enseguida
function borrarPendientesYa() { Array.from(BORRADOS.keys()).forEach(ejecutarBorrado); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') borrarPendientesYa(); });
window.addEventListener('pagehide', borrarPendientesYa);

/* =========================================================
   Aprobación de facturas escaneadas
   Elegir con qué se pagó (crédito, débito, efectivo) y confirmar el comercio.
   ========================================================= */
function abrirAprobacion(id) {
  const m = porId(id);
  if (!m) return;
  const sugerida = m.cuenta && cuenta(m.cuenta) ? m.cuenta : '';
  const dudaComercio = (m.dudas || []).includes('comercio');
  S.cf = null;
  S.ap = { id, cuenta: sugerida, sugerida, comercio: dudaComercio ? '' : m.comercio, comercioOk: !dudaComercio,
    dudaComercio, editarComercio: false, categoria: m.categoria, otro: '', alias: m.alias || '' };
  abrirSheet(htmlAprobacion());
  pintarFotos($('#sheet-body'));
}

function refrescarAprobacion() {
  const body = $('#sheet-body'), hoja = body.parentElement, y = hoja.scrollTop;
  body.innerHTML = htmlAprobacion();
  pintarFotos(body);
  hoja.scrollTop = y;
}

function opcionesComercio(m) {
  const vistos = new Set();
  return [[m.comercio, 'Leído por el escáner'], [m.nombreImpreso, 'Impreso en la factura'], [m.razonSocial, 'Razón social']]
    .filter(([v]) => v && !vistos.has(v.trim().toLowerCase()) && vistos.add(v.trim().toLowerCase()));
}

function htmlAprobacion() {
  const a = S.ap, m = a && porId(a.id);
  if (!m) return '';
  if (a.fase === 'hecho') return htmlAprobada(a, m);
  const cola = porRevisar();
  const pos = Math.max(1, cola.findIndex(x => x.id === a.id) + 1);
  const restantes = cola.filter(x => x.id !== a.id).length;
  const d = toDate(m.fecha);
  const nItems = detallesDe(m.id).length;
  const thumb = m.fotoId
    ? `<span class="ap__thumb" data-foto="${esc(m.fotoId)}"></span>`
    : `<span class="ap__thumb"><span class="ms">receipt_long</span></span>`;

  const grupos = ['Crédito', 'Débito', 'Efectivo'].map(tipo => {
    const cs = S.cuentas.filter(c => (c.tipo || 'Débito') === tipo);
    if (!cs.length) return '';
    return `<div class="ap__grupo"><span class="ap__gt">${tipo}</span><div class="ap__cards">${cs.map(c => {
      const on = a.cuenta === c.id;
      return `<button class="acard ${on ? 'on' : ''}" data-act="ap-cuenta" data-id="${esc(c.id)}" aria-pressed="${on}">
        <span class="sw sw--${esc(c.color)} acard__sw">${c.logoId ? `<span class="clogo sm" data-foto="${esc(c.logoId)}"></span>` : `<span class="ms">${iconoCuenta(c)}</span>`}</span>
        <span class="acard__txt"><b>${esc(c.nombre)}</b><span>${c.ultimos4 ? '•••• ' + esc(c.ultimos4) : esc(tipo)}</span></span>
        ${a.sugerida === c.id ? '<i class="acard__sug">Sugerida</i>' : ''}
        <span class="ms fill acard__ok">check_circle</span></button>`;
    }).join('')}</div></div>`;
  }).join('');

  const pista = m.marcaTarjeta
    ? `<p class="ap__pista"><span class="ms">credit_card</span><span>La factura dice <b>${esc(m.marcaTarjeta)}</b>${a.sugerida || a.cuenta ? '.' : '. No encontré una cuenta con esa marca: elígela o agrégala.'}</span></p>`
    : (a.sugerida ? '' : '<p class="ap__pista"><span class="ms">help</span><span>La factura no muestra con qué pagaste.</span></p>');

  let comercioHtml;
  if (a.dudaComercio || a.editarComercio) {
    const ops = opcionesComercio(m).map(([v, lbl]) => `<button class="apop ${a.comercio === v && a.otro === '' ? 'on' : ''}" data-act="ap-com" data-v="${esc(v)}">
        <b>${esc(v)}</b><span>${lbl}</span></button>`).join('');
    comercioHtml = `<div class="ap__duda ${a.dudaComercio ? '' : 'neutra'}">
      ${a.dudaComercio ? '<p class="ap__dudat"><span class="ms">warning</span>No estoy seguro del nombre del comercio. Elige o escribe cómo quieres verlo.</p>' : ''}
      <div class="apops">${ops}</div>
      <input class="input" id="ap-com-input" placeholder="Escribir otro nombre (ej. Supermaxi)" value="${esc(a.otro)}" autocomplete="off">
      ${m.ruc ? `<p class="hint sm">Lo recordaré para las próximas facturas con RUC ${esc(m.ruc)}.</p>` : ''}
    </div>`;
  } else {
    comercioHtml = `<div class="ap__okrow"><span class="ms fill c-green">check_circle</span><b>${esc(a.comercio)}</b>
      <button class="link" data-act="ap-com-editar">Cambiar<span class="ms">edit</span></button></div>`;
  }

  const cats = selectorCategorias({ sel: [a.categoria], act: 'ap-cat' });

  const falta = !a.cuenta ? 'Elige con qué pagaste para aprobar.' : !a.comercioOk ? 'Confirma el nombre del comercio para aprobar.' : '';

  return `<div class="sheet__head"><div><h3>Aprobar factura</h3><p>${pos} de ${cola.length} por aprobar</p></div>
      <button class="iconbtn sm" data-act="cerrar" aria-label="Cerrar"><span class="ms">close</span></button></div>
    <div class="ap">
      <div class="ap__res">${thumb}
        <span class="tx__main"><span class="ap__monto num">-${money(m.monto)}</span>
          <span class="tx__sub">${d.getDate()} ${cap(MES_C[d.getMonth()])} ${d.getFullYear()}${nItems ? ' · ' + plural(nItems, 'producto', 'productos') : ''}</span></span></div>

      <section class="ap__sec"><h4>¿Con qué pagaste?</h4>${pista}${grupos || '<p class="hint sm">Aún no tienes cuentas.</p>'}
        <button class="ap__add" data-act="cuenta-nueva"><span class="ms">add_card</span>Agregar cuenta</button></section>

      <section class="ap__sec"><h4>Establecimiento</h4>${comercioHtml}</section>

      <section class="ap__sec"><h4>¿Cómo lo recuerdas? <span class="ap__opc">Opcional</span></h4>
        <input class="input" id="ap-alias" maxlength="80" placeholder="Ej. El Supermaxi de mi casa" value="${esc(a.alias)}" autocomplete="off">
        <p class="hint sm">Lo verás en grande en la app y el nombre oficial debajo.${m.ruc ? ' También lo usaré en las próximas facturas de este RUC.' : ''}</p></section>

      <section class="ap__sec"><h4>Categoría</h4>${cats}</section>

      <div class="actions">
        <button class="btn btn--primary" id="ap-aprobar" data-act="ap-aprobar" ${falta ? 'disabled' : ''}><span class="ms">task_alt</span>${restantes ? 'Aprobar y siguiente' : 'Aprobar'}</button>
        <p class="ap__falta" id="ap-falta">${falta}</p>
        <button class="btn btn--ghost" data-act="ap-ver"><span class="ms">open_in_new</span>Ver detalle del movimiento</button>
      </div>
    </div>`;
}

function htmlAprobada(a, m) {
  const restantes = porRevisar().length;
  const nMom = momentosDe(m.id).length;
  const prog = a.subiendo ? `<div class="mfprog"><i style="width:${Math.round((a.hechas || 0) / a.total * 100)}%"></i></div>

      ${prog}

      <div class="actions">

        <button class="btn btn--ghost" data-act="ap-siguiente" ${a.subiendo ? 'disabled' : ''}>${restantes ? `Siguiente factura · ${restantes}<span class="ms">arrow_forward</span>` : 'Listo'}</button>
      </div>
    </div>`;

async function subirTrasAprobar(id, archivos) {
  const enHoja = () => S.ap && S.ap.id === id && S.ap.fase === 'hecho';
  const total = Math.min(archivos.length, MAX_MOM - momentosDe(id).length);
  if (total <= 0) return aviso(`Máximo ${MAX_MOM} fotos por movimiento`, 'info', true);
  if (enHoja()) { Object.assign(S.ap, { subiendo: true, hechas: 0, total }); refrescarAprobacion(); }
  const r = await subirMomentos(id, archivos, k => { if (enHoja()) { S.ap.hechas = k; refrescarAprobacion(); } });
  render();
  if (enHoja()) {
    S.ap.subiendo = false;
    S.ap.subidas = (S.ap.subidas || 0) + r.ok;
    refrescarAprobacion();
    if (r.fallos) aviso(`${plural(r.fallos, 'foto no se pudo', 'fotos no se pudieron')} subir`, 'error', true);
  } else avisoSubida(id, r);
}

function siguienteAprobacion() {

  else { cerrarSheet(); aviso('Todas las facturas están aprobadas', 'task_alt'); }

function actualizarBotonAprobar() {
  const a = S.ap, btn = $('#ap-aprobar');
  if (!a || !btn) return;
  const falta = !a.cuenta ? 'Elige con qué pagaste para aprobar.' : !a.comercioOk ? 'Confirma el nombre del comercio para aprobar.' : '';
  btn.disabled = !!falta;
  $('#ap-falta').textContent = falta;
}

async function aprobarActual(btn) {
  const a = S.ap;
  if (!a || !a.cuenta || !a.comercioOk) return;
  ocupado(btn, true, 'Aprobando…');
  try {
    const alias = String(a.alias || '').trim();
    const g = await API.aprobarMovimiento({ id: a.id, cuenta: a.cuenta, comercio: a.comercio.trim(), categoria: a.categoria, alias });
    S.movs = S.movs.map(x => x.id === g.id ? Object.assign({}, x, g) : x);
    const m = porId(g.id);
    if (m && m.ruc) {
      S.movs.filter(x => x.estado === 'Por revisar' && x.ruc === m.ruc).forEach(x => {
        x.comercio = g.comercio;
        x.categoria = a.categoria;
        x.alias = alias;
        x.dudas = (x.dudas || []).filter(t => t !== 'comercio');
      });
    }
    render();
    // Paso intermedio: ofrecer fotos del momento antes de seguir con la cola
    S.ap = { id: g.id, fase: 'hecho', subidas: 0 };
    refrescarAprobacion();
  } catch (e) {
    ocupado(btn, false);
    aviso(msgErr(e), 'error', true);
  }
}

async function guardarCuentaActual(btn) {
  const c = S.cf;
  if (!String(c.nombre).trim()) return aviso('Escribe el nombre de la cuenta', 'error', true);
  ocupado(btn, true);
  try {
    const g = await API.guardarCuenta(c);
    if (c.logoData && g.logoId) FOTOS[g.logoId] = c.logoData;
    const i = S.cuentas.findIndex(x => x.id === g.id);
    if (i >= 0) S.cuentas[i] = g; else S.cuentas.push(g);
    if (S.ap) {
      // Volver a la aprobación con la cuenta nueva elegida
      S.cf = null;
      S.ap.cuenta = g.id;
      refrescarAprobacion();
      render();
    } else {
      cerrarSheet();
      render();
    }
    aviso('Cuenta guardada');
  } catch (e) { ocupado(btn, false); aviso(msgErr(e), 'error', true); }
}

async function eliminarCuentaActual() {
  const c = S.cf;
  if (S.movs.some(m => m.cuenta === c.id)) return aviso('Esta cuenta tiene movimientos; no se puede eliminar', 'error', true);
  const ok = await confirmar('¿Eliminar cuenta?', `Se eliminará “${esc(c.nombre)}”.`);
  if (!ok) return;
  try {
    await API.eliminarCuenta(c.id);
    S.cuentas = S.cuentas.filter(x => x.id !== c.id);

    render();

  } catch (e) { aviso(msgErr(e), 'error', true); }
}

/* =========================================================
   Visor de historias (momentos)
   Toque a la derecha: siguiente · izquierda: anterior · mantener: pausa
   Deslizar ←/→: otro movimiento · deslizar ↓: cerrar
   ========================================================= */
const ST = { ids: [], i: 0, j: 0, acum: 0, t0: 0, listo: false, pausado: false, raf: 0, token: 0, DUR: 5000 };

function abrirHistorias(ids, i = 0, j = 0) {
  if (!ids.length) return;
  Object.assign(ST, { ids: ids.slice(), i, j, pausado: false });
  const el = $('#story');
  el.hidden = false;
  el.classList.remove('oculto');
  document.body.classList.add('story-open');
  cancelAnimationFrame(ST.raf);
  ST.raf = requestAnimationFrame(tickHistoria);
  mostrarHistoria();
}

function cerrarHistorias() {
  if ($('#story').hidden) return;
  cancelAnimationFrame(ST.raf);
  ST.token++;
  ST.listo = false;
  $('#story').hidden = true;
  document.body.classList.remove('story-open');
  render();
}

function mostrarHistoria() {
  const m = porId(ST.ids[ST.i]);
  const fotos = m ? momentosDe(m.id) : [];
  if (!fotos.length) {
    ST.ids.splice(ST.i, 1);
    if (ST.i >= ST.ids.length) return cerrarHistorias();
    ST.j = 0;
    return mostrarHistoria();
  }
  ST.j = Math.max(0, Math.min(ST.j, fotos.length - 1));
  const c = cat(m.categoria), mo = fotos[ST.j], ing = m.tipo === 'Ingreso';

  $('#st-bars').innerHTML = fotos.map((_, k) => `<i><b style="width:${k < ST.j ? 100 : 0}%"></b></i>`).join('');
  const av = $('#st-av');
  av.style.background = hexA(c.color, .3);
  av.style.color = c.color;
  av.innerHTML = `<span class="ms">${esc(c.icono)}</span>`;
  $('#st-name').textContent = nombreDe(m);
  $('#st-meta').textContent = `${haceCuanto(m.fecha)} · ${m.categoria}`;
  const amt = $('#st-amt');
  amt.textContent = signo(m);
  amt.style.color = ing ? 'var(--green)' : '#fff';
  $('#st-desc').innerHTML = [
    m.ubicacion ? `<span class="ms">location_on</span>${esc(m.ubicacion)}` : '',
    m.descripcion ? esc(m.descripcion) : ''
  ].filter(Boolean).join('<br>');

  ST.pausado = false;
  $('#st-pausa .ms').textContent = 'pause';
  ST.listo = false;
  ST.acum = 0;
  const img = $('#st-img');
  img.style.opacity = 0;
  img.classList.remove('in');
  $('#st-spin').hidden = false;
  const token = ++ST.token;

  pedirFoto(mo.fotoId)
    .then(src => {
      if (token !== ST.token) return;
      img.src = src;
      $('#st-bg').style.backgroundImage = `url("${src}")`;
      return img.decode ? img.decode().catch(() => {}) : null;
    })
    .then(() => {
      if (token !== ST.token) return;
      $('#st-spin').hidden = true;
      void img.offsetWidth;
      img.style.opacity = 1;
      img.classList.add('in');
      ST.listo = true;
      ST.t0 = performance.now();
      marcarVisto(mo.id);
      precargarSiguiente();
    })
    .catch(() => {
      if (token !== ST.token) return;
      $('#st-spin').hidden = true;
      aviso('No se pudo cargar una foto', 'error', true);
      setTimeout(() => { if (token === ST.token) siguienteHistoria(); }, 800);
    });
}

function precargarSiguiente() {
  const fotos = momentosDe(ST.ids[ST.i]);
  const sig = fotos[ST.j + 1] || (ST.ids[ST.i + 1] && momentosDe(ST.ids[ST.i + 1])[0]);
  if (sig) pedirFoto(sig.fotoId).catch(() => {});
}

function tickHistoria(now) {
  ST.raf = requestAnimationFrame(tickHistoria);
  if (!ST.listo || ST.pausado) return;
  const p = Math.min(1, (ST.acum + now - ST.t0) / ST.DUR);
  const barra = $$('#st-bars b')[ST.j];
  if (barra) barra.style.width = (p * 100) + '%';
  if (p >= 1) siguienteHistoria();
}

function siguienteHistoria() {
  const n = momentosDe(ST.ids[ST.i]).length;
  if (ST.j < n - 1) ST.j++;
  else if (ST.i < ST.ids.length - 1) { ST.i++; ST.j = 0; }
  else return cerrarHistorias();
  mostrarHistoria();
}

function anteriorHistoria() {
  if (ST.j > 0) ST.j--;
  else if (ST.i > 0) { ST.i--; ST.j = 0; }
  mostrarHistoria();
}

function saltarMovimiento(d) {
  const k = ST.i + d;
  if (k < 0) { ST.j = 0; return mostrarHistoria(); }
  if (k >= ST.ids.length) return cerrarHistorias();
  ST.i = k;
  ST.j = 0;
  mostrarHistoria();
}

function pausarHistoria(si, ocultarUI) {
  const el = $('#story');
  el.classList.toggle('oculto', !!(si && ocultarUI));
  if (si === ST.pausado) return;
  const now = performance.now();
  if (si) { if (ST.listo) ST.acum += now - ST.t0; }
  else ST.t0 = now;
  ST.pausado = si;
  $('#st-pausa .ms').textContent = si ? 'play_arrow' : 'pause';
}

async function eliminarMomentoActual() {
  const m = porId(ST.ids[ST.i]);
  const mo = m && momentosDe(m.id)[ST.j];
  if (!mo) return;
  pausarHistoria(true);
  const ok = await confirmar('¿Eliminar esta foto?', 'Se quitará de este momento y se borrará de tu Drive.');
  if (!ok) return pausarHistoria(false);
  try {
    await API.eliminarMomento(mo.id);
    S.momentos = S.momentos.filter(x => x.id !== mo.id);
    aviso('Foto eliminada', 'delete');
    mostrarHistoria();
  } catch (e) {
    aviso(msgErr(e), 'error', true);
    pausarHistoria(false);
  }
}

(function gestosHistoria() {
  const fr = $('#st-frame');
  let x0 = 0, y0 = 0, activo = false, mantenido = false, holdT = 0;
  fr.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    activo = true; mantenido = false; x0 = e.clientX; y0 = e.clientY;
    holdT = setTimeout(() => { mantenido = true; pausarHistoria(true, true); }, 220);
  });
  fr.addEventListener('pointerup', e => {
    if (!activo) return;
    activo = false;
    clearTimeout(holdT);
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (mantenido) pausarHistoria(false);
    if (dy > 90 && Math.abs(dy) > Math.abs(dx)) return cerrarHistorias();
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) return saltarMovimiento(dx < 0 ? 1 : -1);
    if (mantenido) return;
    const izq = e.clientX - fr.getBoundingClientRect().left < fr.clientWidth * 0.33;
    if (izq) anteriorHistoria(); else siguienteHistoria();
  });
  fr.addEventListener('pointercancel', () => { activo = false; clearTimeout(holdT); if (mantenido) pausarHistoria(false); });
  fr.addEventListener('contextmenu', e => e.preventDefault());
})();

/* ---------- Carga inicial ---------- */
function aplicarDatos(d) {
  const borr = new Set(BORRADOS.keys());   // lo que está por borrarse no reaparece
  S.movs = (d.movimientos || []).filter(m => !borr.has(m.id));
  S.cuentas = d.cuentas || [];
  S.cats = d.categorias || [];
  S.momentos = (d.momentos || []).filter(x => !borr.has(x.movId));
  S.detalles = (d.detalles || []).filter(x => !borr.has(x.movId));
  S.budget = d.presupuesto || { ingreso: 0, rubros: [], apartados: [] };
  S.grupos = d.grupos || [];
  if (d.sri) S.sri = d.sri;
}

/* ---------- Actualizar sin perder dónde estás (deslizar hacia abajo) ---------- */
let recargando = false;
async function recargar() {
  if (recargando) return;
  recargando = true;
  const ptr = $('#ptr');
  ptr.classList.add('girando');
  ptr.style.transform = 'translate(-50%, 0)';
  try {
    const antes = S.movs.length;
    aplicarDatos(await API.getData());
    if (S.detalleId && S.view === 'detalle' && !porId(S.detalleId)) { S.stack = S.stack.filter(v => VISTAS[v].main); S.view = S.stack.pop() || 'inicio'; }
    render();
    const nuevos = S.movs.length - antes;
    aviso(nuevos > 0 ? `Actualizado · ${plural(nuevos, 'movimiento nuevo', 'movimientos nuevos')}` : 'Datos actualizados', 'refresh');
  } catch (e) {
    aviso('No se pudo actualizar: ' + msgErr(e), 'error', true);
  } finally {
    recargando = false;
    ptr.classList.remove('girando', 'listo');
    ptr.style.transform = '';
  }
}

/* ---------- Gestos: deslizar abajo = actualizar · deslizar a la derecha = volver ---------- */
(function gestos() {
  const ptr = document.createElement('div');
  ptr.id = 'ptr'; ptr.className = 'ptr'; ptr.setAttribute('aria-hidden', 'true');
  ptr.innerHTML = '<span class="ms">refresh</span>';
  document.body.appendChild(ptr);
  const atras = document.createElement('div');
  atras.id = 'swb'; atras.className = 'swb'; atras.setAttribute('aria-hidden', 'true');
  atras.innerHTML = '<span class="ms">arrow_back</span>';
  document.body.appendChild(atras);

  const UMBRAL_PTR = 72, UMBRAL_ATRAS = 80;
  let x0 = 0, y0 = 0, modo = null, dx = 0, dy = 0;
  const capaAbierta = () => !$('#story').hidden || $('#ov-viewer').classList.contains('open') ||
    $('#ov-dialog').classList.contains('open') || $('#ov-sheet').classList.contains('open');
  // Zonas que se desplazan de lado (carruseles, fotos, chips): ahí no se activa "volver"
  const enZonaHorizontal = el => !!el.closest('.carousel, .sbar, .mstrip, .chips:not(.wrap), .trend, input, textarea, select, .donut');

  document.addEventListener('touchstart', e => {
    modo = null; dx = dy = 0;
    if (e.touches.length !== 1 || capaAbierta()) return;
    const t = e.touches[0];
    x0 = t.clientX; y0 = t.clientY;
    modo = { atTop: (window.scrollY || document.documentElement.scrollTop) <= 0, horizOk: !enZonaHorizontal(e.target) && x0 > 12 };
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!modo || e.touches.length !== 1) return;
    const t = e.touches[0];
    dx = t.clientX - x0; dy = t.clientY - y0;
    if (!modo.tipo) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (modo.atTop && dy > 0 && Math.abs(dy) > Math.abs(dx) * 1.2 && S.view !== 'form' && !recargando) modo.tipo = 'ptr';
      else if (modo.horizOk && dx > 0 && Math.abs(dx) > Math.abs(dy) * 1.5 && S.stack.length) modo.tipo = 'atras';
      else { modo = null; return; }
    }
    if (modo.tipo === 'ptr') {
      if (e.cancelable) e.preventDefault();
      const d = Math.min(120, dy * 0.55);
      ptr.style.transition = 'none';
      ptr.style.transform = `translate(-50%, ${d - 56}px) rotate(${dy * 2.2}deg)`;
      ptr.style.opacity = Math.min(1, d / 40);
      ptr.classList.toggle('listo', dy >= UMBRAL_PTR);
    } else if (modo.tipo === 'atras') {
      if (e.cancelable) e.preventDefault();
      const d = Math.min(90, dx * 0.6);
      atras.style.transition = 'none';
      atras.style.transform = `translate(${d - 50}px, -50%)`;
      atras.style.opacity = Math.min(1, d / 40);
      atras.classList.toggle('listo', dx >= UMBRAL_ATRAS);
      $('#app').style.transform = `translateX(${Math.min(40, dx * 0.15)}px)`;
    }
  }, { passive: false });

  const soltar = () => {
    if (!modo || !modo.tipo) { modo = null; return; }
    const tipo = modo.tipo;
    modo = null;
    if (tipo === 'ptr') {
      ptr.style.transition = ''; ptr.style.opacity = '';
      if (dy >= UMBRAL_PTR) recargar();
      else { ptr.classList.remove('listo'); ptr.style.transform = ''; }
    } else {
      atras.style.transition = ''; atras.style.opacity = ''; atras.style.transform = '';
      atras.classList.remove('listo');
      $('#app').style.transform = '';
      if (dx >= UMBRAL_ATRAS) { S.form = null; back(); }
    }
  };
  document.addEventListener('touchend', soltar, { passive: true });
  document.addEventListener('touchcancel', () => { dy = dx = 0; soltar(); }, { passive: true });
})();

    guardarIngresoBase: v => { db.presupuesto.ingreso = Number(v); return espera(db.presupuesto); },
    guardarRubro: r => {
      const otro = db.presupuesto.rubros.find(x => x.id !== r.id && x.categorias.some(c => (r.categorias || []).includes(c)));
      if (otro) return Promise.reject(new Error(`Una categoría ya está en el rubro "${otro.nombre}".`));
      const x = Object.assign({}, r, { id: r.id || 'r' + (++n), valor: Number(r.valor), categorias: r.tipo === 'Ahorro' ? [] : (r.categorias || []) });
      const i = db.presupuesto.rubros.findIndex(y => y.id === x.id);
      if (i >= 0) db.presupuesto.rubros[i] = x; else db.presupuesto.rubros.push(x);
      return espera(x);
    },
    eliminarRubro: id => { db.presupuesto.rubros = db.presupuesto.rubros.filter(y => y.id !== id); return espera(true); },
    marcarApartado: (mes, id, v) => {
      db.presupuesto.apartados = db.presupuesto.apartados.filter(a => !(a.mes === mes && a.rubroId === id)).concat(v ? [{ mes, rubroId: id }] : []);
      return espera(v, 200);
    },
    iniciarPresupuesto: (v, ej) => {
      db.presupuesto.ingreso = Number(v);
      if (ej && !db.presupuesto.rubros.length) db.presupuesto.rubros = [
        { id: 'r1', nombre: 'Vivienda', icono: 'home', color: '#38bdf8', modo: 'Monto', valor: 200, tipo: 'Gasto', categorias: ['Hogar', 'Servicios'] },
        { id: 'r2', nombre: 'Alimentación', icono: 'shopping_basket', color: '#ff7a8f', modo: 'Monto', valor: 150, tipo: 'Gasto', categorias: ['Comida', 'Restaurantes', 'Café'] },
        { id: 'r3', nombre: 'Suscripciones', icono: 'subscriptions', color: '#c084fc', modo: 'Monto', valor: 50, tipo: 'Gasto', categorias: ['Suscripciones'] },
        { id: 'r4', nombre: 'Ahorro', icono: 'savings', color: '#00D09C', modo: 'Porcentaje', valor: 10, tipo: 'Ahorro', categorias: [] }];
      return espera(db.presupuesto, 600);
    },
    guardarMovimiento: m => {
      const previo = db.movimientos.find(x => x.id === m.id);
      const x = Object.assign({}, previo || {}, m, { id: m.id || 'd' + (++n) });
      if (x.estado === 'Por revisar') x.estado = 'Revisado';
      if (m.fotoData) { x.fotoId = 'local-' + (++n); fotosLocales[x.fotoId] = m.fotoData; }
      else x.fotoId = m.quitarFoto ? '' : (previo && previo.fotoId) || '';
      delete x.fotoData; delete x.quitarFoto;
      db.movimientos = db.movimientos.filter(y => y.id !== x.id).concat(x);
      return espera(x, 600);
    },
    eliminarMovimiento: id => {
      if (!db.movimientos.some(y => y.id === id)) return Promise.reject(new Error('El movimiento ya no existe.'));
      db.movimientos = db.movimientos.filter(y => y.id !== id);
      db.momentos = db.momentos.filter(y => y.movId !== id);
      db.detalles = db.detalles.filter(y => y.movId !== id);
      window.__borrados = (window.__borrados || []).concat(id);
      return espera(true);
    },
    adjuntarComprobante: (id, data) => {
      const x = db.movimientos.find(y => y.id === id);
      if (!x) return Promise.reject(new Error('El movimiento ya no existe.'));
      x.fotoId = 'local-' + (++n); fotosLocales[x.fotoId] = data;
      return espera({ id, fotoId: x.fotoId }, 600);
    },
    agregarMomento: (movId, data) => {
      const fotoId = 'local-' + (++n);
      fotosLocales[fotoId] = data;
      const x = { id: 'mo-l' + n, movId, fotoId, orden: db.momentos.filter(y => y.movId === movId).length + 1 };
      db.momentos.push(x);
      return espera(x, 700);
    },
    eliminarMomento: id => { db.momentos = db.momentos.filter(y => y.id !== id); return espera(true); },
    marcarRevisado: id => { const x = db.movimientos.find(y => y.id === id); if (x) x.estado = 'Revisado'; return espera(true); },
    aprobarMovimiento: a => {
      const x = db.movimientos.find(y => y.id === a.id);
      Object.assign(x, { comercio: a.comercio, cuenta: a.cuenta, categoria: a.categoria || x.categoria, estado: 'Revisado', dudas: [] });
      if (a.alias !== undefined) x.alias = a.alias;
      db.movimientos.filter(y => y.estado === 'Por revisar' && x.ruc && y.ruc === x.ruc)
        .forEach(y => { y.comercio = a.comercio; y.categoria = a.categoria; if (a.alias !== undefined) y.alias = a.alias; y.dudas = (y.dudas || []).filter(t => t !== 'comercio'); });
      return espera(x, 500);
    },
    marcarFavorito: (id, v) => { const x = db.movimientos.find(y => y.id === id); if (x) x.favorito = v; return espera(v, 150); },
    guardarCuenta: c => {
      const x = Object.assign({}, c, { id: c.id || 'c-' + Date.now(), limite: Number(c.limite) || 0, ultimos4: String(c.ultimos4 || '').replace(/\D/g, '').slice(-4) });
      if (c.logoData) { x.logoId = 'logo-' + (++n); fotosLocales[x.logoId] = c.logoData; } else if (c.quitarLogo) x.logoId = '';
      delete x.logoData; delete x.quitarLogo;
      db.cuentas = db.cuentas.some(y => y.id === x.id) ? db.cuentas.map(y => y.id === x.id ? x : y) : db.cuentas.concat(x);
      return espera(x);
    },
    eliminarCuenta: id => { db.cuentas = db.cuentas.filter(y => y.id !== id); return espera(true); }
  };
})();

if (MODO === 'demo') $('#tb-actions').innerHTML = '<span class="demo-badge">Vista previa</span>';

/* ---------- Tema claro / oscuro (se recuerda en este dispositivo) ---------- */
function aplicarTema(tema, guardar) {
  const claro = tema === 'light';
  if (claro) document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  const b = $('#tema');
  if (b) { b.setAttribute('aria-checked', String(claro)); b.setAttribute('aria-label', claro ? 'Tema oscuro' : 'Tema claro'); }
  const ic = $('#tema-ic');
  if (ic) ic.textContent = claro ? 'light_mode' : 'dark_mode';
  if (guardar) { try { localStorage.setItem('mf-tema', claro ? 'light' : 'dark'); } catch (e) { /* sin almacenamiento */ } }
}
aplicarTema(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
window.__mfIniciada = true;
cargar();
</script>
